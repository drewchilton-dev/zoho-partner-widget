<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sales Open Tickets</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #ffffff; color: #333; }
    .ticket-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ticket-table th { background-color: #f1f5f9; color: #475569; font-weight: 600; text-align: left; padding: 10px 12px; border-bottom: 2px solid #cbd5e1; }
    .ticket-table td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
    .ticket-table tr:hover { background-color: #f8fafc; }
    .status-open { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
    a.ticket-link { color: #0284c7; text-decoration: none; font-weight: 600; }
    a.ticket-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <table class="ticket-table">
    <thead>
      <tr>
        <th>Ticket #</th>
        <th>Subject</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="ticket-list">
      <!-- Tickets loaded dynamically -->
    </tbody>
  </table>

  <script>
    const PORTAL_URL = "https://support.acd-inc.com/agent/acdihelpdesk/sales/tickets/details";
    const ORG_ID = "YOUR_DESK_ORG_ID";
    const ACCESS_TOKEN = "YOUR_DESK_ACCESS_TOKEN";

    async function loadTickets() {
      const tbody = document.getElementById('ticket-list');
      try {
        const res = await fetch('https://desk.zoho.com/api/v1/tickets?departmentId=SALES_DEPT_ID&status=Open', {
          headers: {
            'orgId': ORG_ID,
            'Authorization': `Zoho-oauthtoken ${ACCESS_TOKEN}`
          }
        });
        const data = await res.json();
        
        if (!data.data || data.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">No open tickets found.</td></tr>';
          return;
        }

        tbody.innerHTML = data.data.map(t => `
          <tr>
            <td><strong>#${t.ticketNumber}</strong></td>
            <td><a class="ticket-link" href="${PORTAL_URL}/${t.id}" target="_blank">${t.subject}</a></td>
            <td><span class="status-open">${t.status}</span></td>
            <td><a class="ticket-link" href="${PORTAL_URL}/${t.id}" target="_blank">View in Desk ↗</a></td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red; padding:20px;">Unable to load tickets. Verify API credentials.</td></tr>';
      }
    }

    loadTickets();
  </script>
</body>
</html>
