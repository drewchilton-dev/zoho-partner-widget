<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://live.zwidgets.com/js-sdk/1.3/ZohoEmbededAppSDK.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
        }
        .chat-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px;
            height: 100%;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            height: 36px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            outline: none;
            background: #ffffff;
        }
        input[type="text"]:focus {
            border-color: #0275d8;
            box-shadow: 0 0 0 2px rgba(2, 117, 216, 0.2);
        }
        button {
            height: 36px;
            background-color: #0275d8;
            color: #ffffff;
            border: none;
            padding: 0 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #025aa5;
        }
    </style>
</head>
<body>

    <div class="chat-bar">
        <input type="text" id="userMessage" placeholder="Chat Operations..." onkeydown="if(event.key==='Enter') sendChatMessage()">
        <button id="sendBtn" onclick="sendChatMessage()">Send</button>
    </div>

    <script>
        var currentUser = null;

        ZOHO.embeddedApp.on("PageLoad", function() {
            ZOHO.CRM.CONFIG.getCurrentUser().then(function(response) {
                if (response && response.users && response.users.length > 0) {
                    currentUser = response.users[0];
                }
            });
        });

        ZOHO.embeddedApp.init();

        function sendChatMessage() {
            var inputEl = document.getElementById("userMessage");
            var btnEl = document.getElementById("sendBtn");
            var messageText = inputEl.value.trim();

            if (!messageText) return;

            var name = currentUser ? (currentUser.full_name || currentUser.first_name) : "CRM User";
            var email = currentUser ? currentUser.email : "Unknown Email";

            // UI loading state
            inputEl.disabled = true;
            btnEl.disabled = true;
            inputEl.value = "";
            inputEl.placeholder = "Sending...";

            var funcData = {
                "user_name": name,
                "user_email": email,
                "user_message": messageText
            };

            ZOHO.CRM.FUNCTIONS.execute("send_home_page_chat", funcData).then(function(data) {
                inputEl.placeholder = "Sent to Operations! ✓";
                setTimeout(function() {
                    inputEl.placeholder = "Chat Operations...";
                    inputEl.disabled = false;
                    btnEl.disabled = false;
                }, 3000);
            }).catch(function(err) {
                inputEl.placeholder = "Error sending message!";
                setTimeout(function() {
                    inputEl.placeholder = "Chat Operations...";
                    inputEl.disabled = false;
                    btnEl.disabled = false;
                }, 3000);
            });
        }
    </script>
</body>
</html>
