<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rep Action Center</title>
    <!-- Include Tailwind CSS for modern, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Zoho CRM JS SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .modal { display: none; background-color: rgba(0,0,0,0.5); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 p-4">

    <!-- Header & Filter -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-gray-800">Action Center: Connected Potentials</h1>
        <div class="flex items-center gap-2">
            <label for="taskTypeFilter" class="font-semibold text-sm text-gray-600">Task Type Filter:</label>
            <select id="taskTypeFilter" class="border border-gray-300 rounded px-3 py-1 text-sm shadow-sm" onchange="fetchTasksAndPotentials()">
                <option value="">-- Select Task Type --</option>
                <option value="Past Due Potentials">Past Due Potentials</option>
                <option value="PaperCut Leads">PaperCut Leads</option>
                <option value="New MidStrategic Assigned">New MidStrategic Assigned</option>
                <option value="Strategic Follow Up">Strategic Follow Up</option>
            </select>
        </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white shadow rounded-lg overflow-x-auto">
        <table class="min-w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-gray-100 border-b">
                <tr>
                    <th class="px-4 py-3 font-semibold text-gray-600">Potential Name</th>
                    <th class="px-4 py-3 font-semibold text-gray-600">Account Name</th>
                    <th class="px-4 py-3 font-semibold text-gray-600">End User Account</th>
                    <th class="px-4 py-3 font-semibold text-gray-600">Stage</th>
                    <th class="px-4 py-3 font-semibold text-gray-600">Deal Category</th>
                    <th class="px-4 py-3 font-semibold text-gray-600">Closing Date</th>
                    <th class="px-4 py-3 font-semibold text-gray-600">Actions</th>
                </tr>
            </thead>
            <tbody id="potentialsTableBody" class="divide-y divide-gray-200">
                <tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">Select a Task Type to load potentials.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Notes Modal -->
    <div id="notesModal" class="modal fixed inset-0 z-50 items-center justify-center">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
            <h2 class="text-lg font-bold mb-4">Add Note</h2>
            <input type="hidden" id="modalPotentialId">
            <textarea id="newNoteText" rows="4" class="w-full border border-gray-300 rounded p-2 mb-4" placeholder="Type your note here..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeNotesModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Cancel</button>
                <button onclick="saveNote()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save Note</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Hardcoded Dropdown Options
        const stageOptions = ["Qualification", "Needs Analysis", "Value Proposition", "Identify Decision Makers", "Proposal/Price Quote", "Negotiation/Review", "Closed Won", "Closed Lost"];
        const categoryOptions = ["Standard", "Mid", "Strategic"];

        // 1. Initialize Zoho SDK
        ZOHO.embeddedApp.init().then(function() {
            ZOHO.CRM.CONFIG.getCurrentUser().then(function(data){
                currentUser = data.users[0];
            });
        });

        // 2. Fetch Data Flow
        async function fetchTasksAndPotentials() {
            const taskType = document.getElementById('taskTypeFilter').value;
            const tbody = document.getElementById('potentialsTableBody');
            
            if (!taskType) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">Select a Task Type to load potentials.</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>';

            try {
                // Search for Open Tasks owned by current user matching the Task_Type
                const taskQuery = `(Task_Type:equals:${taskType})`;
                const tasksResponse = await ZOHO.CRM.API.searchRecord({Entity: "Tasks", Type: "criteria", Query: taskQuery});
                
                if (!tasksResponse.data || tasksResponse.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">No open tasks found for this category.</td></tr>';
                    return;
                }

                // Filter tasks to only include those not completed and owned by the user
                const relevantTasks = tasksResponse.data.filter(t => t.Status !== "Completed" && t.Owner.id === currentUser.id);
                
                // Extract Potential IDs (What_Id)
                const potentialIds = relevantTasks.map(t => t.What_Id ? t.What_Id.id : null).filter(id => id !== null);
                
                if (potentialIds.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">No potentials connected to these tasks.</td></tr>';
                    return;
                }

                // Remove duplicates if multiple tasks link to the same potential
                const uniquePotentialIds = [...new Set(potentialIds)];
                
                // Fetch the Potentials
                let potentialsData = [];
                for (let pid of uniquePotentialIds) {
                    const potRes = await ZOHO.CRM.API.getRecord({Entity: "Potentials", RecordID: pid});
                    if (potRes.data && potRes.data.length > 0) {
                        potentialsData.push(potRes.data[0]);
                    }
                }

                renderPotentials(potentialsData);

            } catch (error) {
                console.error("Error fetching data: ", error);
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-red-500">Error loading data. Check console.</td></tr>';
            }
        }

        // 3. Render Table rows
        function renderPotentials(potentials) {
            const tbody = document.getElementById('potentialsTableBody');
            tbody.innerHTML = '';

            potentials.forEach(pot => {
                const id = pot.id;
                const potName = pot.Deal_Name || 'N/A';
                const accountName = pot.Account_Name ? pot.Account_Name.name : 'N/A';
                const endUser = pot.End_User_Account ? pot.End_User_Account.name : ''; // Ensure correct API name
                const currentStage = pot.Stage || '';
                const currentCat = pot.Deal_Category || '';
                const closingDate = pot.Closing_Date || '';

                // Build Stage Options
                let stageHtml = `<select id="stage_${id}" class="border border-gray-300 rounded p-1 text-sm">`;
                stageOptions.forEach(opt => {
                    stageHtml += `<option value="${opt}" ${currentStage === opt ? 'selected' : ''}>${opt}</option>`;
                });
                stageHtml += `</select>`;

                // Build Category Options
                let catHtml = `<select id="cat_${id}" class="border border-gray-300 rounded p-1 text-sm">`;
                categoryOptions.forEach(opt => {
                    catHtml += `<option value="${opt}" ${currentCat === opt ? 'selected' : ''}>${opt}</option>`;
                });
                catHtml += `</select>`;

                const rowHtml = `
                    <tr class="hover:bg-gray-50" id="row_${id}">
                        <td class="px-4 py-3 text-blue-600 font-medium">${potName}</td>
                        <td class="px-4 py-3">${accountName}</td>
                        <td class="px-4 py-3">${endUser}</td>
                        <td class="px-4 py-3">${stageHtml}</td>
                        <td class="px-4 py-3">${catHtml}</td>
                        <td class="px-4 py-3"><input type="date" id="date_${id}" value="${closingDate}" class="border border-gray-300 rounded p-1 text-sm"></td>
                        <td class="px-4 py-3 flex gap-2">
                            <button onclick="updatePotential('${id}')" class="px-3 py-1 bg-green-600 text-white text-xs rounded hover:bg-green-700">Save</button>
                            <button onclick="openNotesModal('${id}')" class="px-3 py-1 bg-blue-100 text-blue-700 text-xs rounded border border-blue-300 hover:bg-blue-200">Add Note</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

        // 4. Update Potential Record (Inline Edit)
        async function updatePotential(recordId) {
            const newStage = document.getElementById(`stage_${recordId}`).value;
            const newCat = document.getElementById(`cat_${recordId}`).value;
            const newDate = document.getElementById(`date_${recordId}`).value;

            const config = {
                Entity: "Potentials",
                APIData: {
                    "id": recordId,
                    "Stage": newStage,
                    "Deal_Category": newCat,
                    "Closing_Date": newDate
                }
            };

            try {
                await ZOHO.CRM.API.updateRecord(config);
                // Highlight row green briefly to show success
                const row = document.getElementById(`row_${recordId}`);
                row.classList.add("bg-green-100");
                setTimeout(() => row.classList.remove("bg-green-100"), 1500);
            } catch (error) {
                alert("Failed to update record. Check console for details.");
                console.error(error);
            }
        }

        // 5. Notes Modal Logic
        function openNotesModal(potentialId) {
            document.getElementById('modalPotentialId').value = potentialId;
            document.getElementById('newNoteText').value = '';
            document.getElementById('notesModal').classList.add('active');
        }

        function closeNotesModal() {
            document.getElementById('notesModal').classList.remove('active');
        }

        async function saveNote() {
            const potentialId = document.getElementById('modalPotentialId').value;
            const noteContent = document.getElementById('newNoteText').value;

            if (!noteContent.trim()) {
                alert("Note cannot be empty.");
                return;
            }

            const recordData = {
                "Parent_Id": potentialId,
                "se_module": "Potentials",
                "Note_Title": "Update via Action Center",
                "Note_Content": noteContent
            };

            try {
                await ZOHO.CRM.API.insertRecord({Entity: "Notes", APIData: recordData});
                closeNotesModal();
                alert("Note added successfully!");
            } catch (error) {
                alert("Error saving note.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
