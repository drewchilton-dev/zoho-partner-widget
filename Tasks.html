<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rep Action Center</title>
    <!-- Include Tailwind CSS for modern, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Custom ACDI Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        acdiDark: '#263238', /* Dark Slate from logo */
                        acdiGreen: '#8DC63F', /* Lime Green from logo */
                        acdiGreenHover: '#7ab332'
                    }
                }
            }
        }
    </script>
    <!-- Include Zoho CRM JS SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .modal { display: none; background-color: rgba(38, 50, 56, 0.7); }
        .modal.active { display: flex; }
        /* Prevent browser date input inner buttons from forcing excessive width */
        input[type="date"]::-webkit-inner-spin-button,
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-50 p-2 text-acdiDark overflow-x-hidden">

    <!-- Header & Filters -->
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 gap-3 border-b-2 border-acdiGreen pb-3">
        <h1 class="text-xl font-bold text-acdiDark tracking-tight">Action Center: Connected Potentials</h1>
        
        <div class="flex flex-wrap items-center gap-2">
            <!-- Task Type Filter -->
            <div class="flex items-center gap-1.5">
                <label for="taskTypeFilter" class="font-semibold text-xs text-acdiDark">Task Type:</label>
                <select id="taskTypeFilter" class="border border-gray-300 rounded px-2 py-1 text-xs shadow-sm focus:border-acdiGreen focus:ring-1 focus:ring-acdiGreen outline-none" onchange="fetchTasksAndPotentials()">
                    <option value="">-- Select Task Type --</option>
                    <option value="Past Due Potentials">Past Due Potentials</option>
                    <option value="PaperCut Leads">PaperCut Leads</option>
                    <option value="New MidStrategic Assigned">New MidStrategic Assigned</option>
                    <option value="Strategic Follow Up">Strategic Follow Up</option>
                </select>
            </div>

            <!-- Task Due Date Filter -->
            <div class="flex items-center gap-1.5">
                <label for="taskDateFilter" class="font-semibold text-xs text-acdiDark">Task Due:</label>
                <select id="taskDateFilter" class="border border-gray-300 rounded px-2 py-1 text-xs shadow-sm focus:border-acdiGreen focus:ring-1 focus:ring-acdiGreen outline-none" onchange="fetchTasksAndPotentials()">
                    <option value="">All</option>
                    <option value="Today">Today</option>
                    <option value="This Week">This Week</option>
                    <option value="This Month">This Month</option>
                    <option value="Past Due">Past Due</option>
                </select>
            </div>

            <!-- Potential Closing Date Filter -->
            <div class="flex items-center gap-1.5">
                <label for="potDateFilter" class="font-semibold text-xs text-acdiDark">Closing Date:</label>
                <select id="potDateFilter" class="border border-gray-300 rounded px-2 py-1 text-xs shadow-sm focus:border-acdiGreen focus:ring-1 focus:ring-acdiGreen outline-none" onchange="fetchTasksAndPotentials()">
                    <option value="">All</option>
                    <option value="Today">Today</option>
                    <option value="This Week">This Week</option>
                    <option value="This Month">This Month</option>
                    <option value="Past Due">Past Due</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Data Table (Enforced table-fixed 100% width, no horizontal scroll) -->
    <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200 w-full">
        <table class="w-full table-fixed text-left text-xs">
            <thead class="bg-acdiDark text-white">
                <tr>
                    <th class="px-2 py-2 font-semibold w-[18%] leading-tight">Potential Name</th>
                    <th class="px-2 py-2 font-semibold w-[10%] leading-tight">Potential Owner</th>
                    <th class="px-2 py-2 font-semibold w-[12%] leading-tight">Account Name</th>
                    <th class="px-2 py-2 font-semibold w-[12%] leading-tight">End User Account</th>
                    <th class="px-2 py-2 font-semibold w-[9%] leading-tight">Stage</th>
                    <th class="px-2 py-2 font-semibold w-[8%] leading-tight">Deal Category</th>
                    <th class="px-1.5 py-2 font-semibold w-[11%] leading-tight text-center">Closing Date</th>
                    <th class="px-1.5 py-2 font-semibold w-[11%] leading-tight text-center">Remind Date</th>
                    <th class="px-1.5 py-2 font-semibold w-[9%] leading-tight text-center">Actions</th>
                </tr>
            </thead>
            <tbody id="potentialsTableBody" class="divide-y divide-gray-200">
                <tr><td colspan="9" class="px-4 py-10 text-center text-gray-500 font-medium">Select a Task Type to load potentials.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Notes Modal -->
    <div id="notesModal" class="modal fixed inset-0 z-50 items-center justify-center">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-5 relative border-t-4 border-acdiGreen m-4">
            <h2 class="text-lg font-bold mb-3 text-acdiDark">Add Note</h2>
            <input type="hidden" id="modalPotentialId">
            <input type="text" id="newNoteTitle" class="w-full border border-gray-300 rounded p-2 mb-3 text-xs focus:border-acdiGreen focus:ring-1 focus:ring-acdiGreen outline-none" placeholder="Note Title (Optional)">
            <textarea id="newNoteText" rows="4" class="w-full border border-gray-300 rounded p-2 mb-3 text-xs focus:border-acdiGreen focus:ring-1 focus:ring-acdiGreen outline-none" placeholder="Type your note here..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeNotesModal()" class="px-3 py-1.5 bg-gray-200 text-gray-700 text-xs font-medium rounded hover:bg-gray-300 transition-colors">Cancel</button>
                <button onclick="saveNote()" class="px-3 py-1.5 bg-acdiGreen text-white text-xs font-medium rounded hover:bg-acdiGreenHover transition-colors shadow">Save Note</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        function checkDateFilter(dateStr, filterType) {
            if (!filterType) return true; 
            if (!dateStr) return false; 

            const today = new Date();
            const todayStr = today.toLocaleDateString('en-CA'); 

            if (filterType === 'Past Due') return dateStr < todayStr;
            if (filterType === 'Today') return dateStr === todayStr;
            if (filterType === 'This Month') return dateStr.substring(0, 7) === todayStr.substring(0, 7);
            if (filterType === 'This Week') {
                const curr = new Date();
                const first = curr.getDate() - curr.getDay(); 
                const startOfWeek = new Date(curr.setDate(first)).toLocaleDateString('en-CA');
                const endOfWeek = new Date(curr.setDate(first + 6)).toLocaleDateString('en-CA');
                return dateStr >= startOfWeek && dateStr <= endOfWeek;
            }
            return true;
        }

        ZOHO.embeddedApp.init().then(function() {
            ZOHO.CRM.CONFIG.getCurrentUser().then(async function(data){
                currentUser = data.users[0];
                const loggedInName = currentUser.full_name || `${currentUser.first_name} ${currentUser.last_name}`;
                
                if (loggedInName.includes("Drew Chilton")) {
                    console.log("Test Mode: Drew Chilton detected. Fetching Jeff Vincent' ID...");
                    try {
                        const userResponse = await ZOHO.CRM.API.getAllUsers({Type: "ActiveUsers"});
                        const targetUser = userResponse.users.find(u => 
                            (u.full_name && u.full_name.includes("Jeff Vincent")) || 
                            (u.first_name === "Jeff" && u.last_name === "Vincent")
                        );
                        if (targetUser) {
                            currentUser = targetUser;
                            console.log("Override successful.");
                        }
                    } catch (error) {
                        console.error("Error fetching users: ", error);
                    }
                }
            });
        });

        async function fetchTasksAndPotentials() {
            const taskType = document.getElementById('taskTypeFilter').value;
            const taskDateFilter = document.getElementById('taskDateFilter').value;
            const potDateFilter = document.getElementById('potDateFilter').value;
            const tbody = document.getElementById('potentialsTableBody');
            
            if (!taskType) {
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-gray-500 font-medium">Select a Task Type to load potentials.</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-acdiGreen font-bold">Loading records...</td></tr>';

            try {
                const taskQuery = `(Task_Type:equals:${taskType})`;
                const tasksResponse = await ZOHO.CRM.API.searchRecord({Entity: "Tasks", Type: "criteria", Query: taskQuery});
                
                if (!tasksResponse.data || tasksResponse.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-gray-500 font-medium">No open tasks found.</td></tr>';
                    return;
                }

                const relevantTasks = tasksResponse.data.filter(t => {
                    if (t.Status === "Completed" || t.Owner.id !== currentUser.id) return false;
                    return checkDateFilter(t.Due_Date || '', taskDateFilter);
                });
                
                const potentialIds = relevantTasks.map(t => t.What_Id ? t.What_Id.id : null).filter(id => id !== null);
                
                if (potentialIds.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-gray-500 font-medium">No potentials connected to these tasks.</td></tr>';
                    return;
                }

                const uniquePotentialIds = [...new Set(potentialIds)];
                
                let potentialsData = [];
                for (let pid of uniquePotentialIds) {
                    const potRes = await ZOHO.CRM.API.getRecord({Entity: "Potentials", RecordID: pid});
                    if (potRes.data && potRes.data.length > 0) {
                        potentialsData.push(potRes.data[0]);
                    }
                }

                const finalPotentials = potentialsData.filter(pot => {
                    return checkDateFilter(pot.Closing_Date || '', potDateFilter);
                });

                if (finalPotentials.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-gray-500 font-medium">No potentials match the filter.</td></tr>';
                    return;
                }

                renderPotentials(finalPotentials);

            } catch (error) {
                console.error("Error fetching data: ", error);
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-red-500 font-medium">Error loading data.</td></tr>';
            }
        }

        function openPotential(recordId) {
            const url = `https://crm.zoho.com/crm/tab/Potentials/${recordId}`;
            window.open(url, '_blank');
        }

        function renderPotentials(potentials) {
            const tbody = document.getElementById('potentialsTableBody');
            tbody.innerHTML = '';

            potentials.forEach(pot => {
                const id = pot.id;
                const potName = pot.Deal_Name || 'N/A';
                const ownerName = pot.Owner ? pot.Owner.name : 'N/A';
                const accountName = pot.Account_Name ? pot.Account_Name.name : 'N/A';
                const endUser = pot.Existing_End_User_Account ? pot.Existing_End_User_Account.name : '';
                const currentStage = pot.Stage || '';
                const currentCat = pot.Deal_Category || '';
                const closingDate = pot.Closing_Date || '';
                const remindDate = pot.Remind_Date || ''; 

                const rowHtml = `
                    <tr class="hover:bg-blue-50 transition-colors" id="row_${id}">
                        <td class="px-2 py-2">
                            <button onclick="openPotential('${id}')" title="${potName}" class="text-acdiGreen font-bold hover:underline text-left bg-transparent border-none cursor-pointer truncate block w-full">${potName}</button>
                        </td>
                        <td class="px-2 py-2">
                            <span title="${ownerName}" class="truncate block">${ownerName}</span>
                        </td>
                        <td class="px-2 py-2">
                            <span title="${accountName}" class="truncate block">${accountName}</span>
                        </td>
                        <td class="px-2 py-2">
                            <span title="${endUser}" class="truncate block">${endUser}</span>
                        </td>
                        <td class="px-2 py-2">
                            <span title="${currentStage}" class="truncate block">${currentStage}</span>
                        </td>
                        <td class="px-2 py-2">
                            <span title="${currentCat}" class="truncate block">${currentCat}</span>
                        </td>
                        <td class="px-1.5 py-2 text-center">
                            <input type="date" id="date_${id}" value="${closingDate}" class="w-full border border-gray-300 rounded px-1 py-0.5 text-[11px] focus:border-acdiGreen focus:ring-1 focus:ring-acdiGreen outline-none">
                        </td>
                        <td class="px-1.5 py-2 text-center">
                            <input type="date" id="remind_${id}" value="${remindDate}" class="w-full border border-gray-300 rounded px-1 py-0.5 text-[11px] focus:border-acdiGreen focus:ring-1 focus:ring-acdiGreen outline-none">
                        </td>
                        <td class="px-1.5 py-2">
                            <div class="flex flex-col gap-1 items-stretch">
                                <button onclick="updatePotential('${id}')" class="w-full py-0.5 bg-acdiGreen text-white font-medium text-[11px] rounded shadow-sm hover:bg-acdiGreenHover transition-colors">Save</button>
                                <button onclick="openNotesModal('${id}')" class="w-full py-0.5 bg-white text-acdiDark font-medium text-[11px] rounded border border-gray-300 shadow-sm hover:border-acdiGreen hover:text-acdiGreen transition-colors whitespace-nowrap">Add Note</button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

        async function updatePotential(recordId) {
            const newDate = document.getElementById(`date_${recordId}`).value;
            const newRemindDate = document.getElementById(`remind_${recordId}`).value;

            const config = {
                Entity: "Potentials",
                APIData: {
                    "id": recordId,
                    "Closing_Date": newDate,
                    "Remind_Date": newRemindDate 
                }
            };

            try {
                await ZOHO.CRM.API.updateRecord(config);
                const row = document.getElementById(`row_${recordId}`);
                row.classList.add("bg-green-100");
                setTimeout(() => row.classList.remove("bg-green-100"), 1500);
            } catch (error) {
                alert("Failed to update record. Check console for details.");
                console.error(error);
            }
        }

        function openNotesModal(potentialId) {
            document.getElementById('modalPotentialId').value = potentialId;
            document.getElementById('newNoteTitle').value = '';
            document.getElementById('newNoteText').value = '';
            document.getElementById('notesModal').classList.add('active');
        }

        function closeNotesModal() {
            document.getElementById('notesModal').classList.remove('active');
        }

        async function saveNote() {
            const potentialId = document.getElementById('modalPotentialId').value;
            const noteTitle = document.getElementById('newNoteTitle').value;
            const noteContent = document.getElementById('newNoteText').value;

            if (!noteContent.trim()) {
                alert("Note cannot be empty.");
                return;
            }

            const recordData = {
                "Parent_Id": potentialId,
                "se_module": "Potentials",
                "Note_Content": noteContent
            };

            if (noteTitle.trim()) {
                recordData["Note_Title"] = noteTitle.trim();
            }

            try {
                // 1. Insert Note into CRM
                await ZOHO.CRM.API.insertRecord({Entity: "Notes", APIData: recordData});
                closeNotesModal();

                // 2. Trigger auto-close Deluge function directly
                await ZOHO.CRM.FUNCTIONS.execute("automation.auto_close_past_due_tasks", {
                    "dealId": potentialId
                });

                alert("Note added and tasks updated successfully!");
                fetchTasksAndPotentials(); // Refresh grid to clear completed tasks
            } catch (error) {
                alert("Error saving note.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
