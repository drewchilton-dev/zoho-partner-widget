<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Order PO Review</title>
<style>
:root {
  --navy:#253238; --bright-navy:#365059; --lime:#8cc540; --oat:#f6f6f3;
  --light-green:#c8df8e; --dark-green:#5b8419; --grey:#bdcbcd;
  --light-teal:#88acb5; --dark-teal:#478191;
}
*{box-sizing:border-box}
body{margin:0;background:var(--oat);color:var(--navy);font:15px Barlow,system-ui,sans-serif;padding:20px}
.masthead{padding:16px 20px;background:var(--navy);color:white;border-left:6px solid var(--lime);border-radius:8px}
.masthead p{margin:4px 0 0;color:var(--light-green)}
h1{margin:0;font-size:25px} h2{margin:0 0 12px;font-size:18px} h3{margin:18px 0 8px;font-size:16px}
p{margin:8px 0} .muted{color:var(--bright-navy)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;margin-top:16px;align-items:start}
section{min-width:0;background:white;border:1px solid var(--grey);border-top:3px solid var(--lime);border-radius:8px;padding:16px}
.document-panel{position:sticky;top:12px}
a{color:var(--bright-navy);text-decoration-color:var(--dark-teal);text-underline-offset:3px}
textarea{color:var(--navy);background:var(--oat);border:1px solid var(--grey);border-radius:4px;padding:8px}
iframe,img{width:100%;display:block;border:0;margin-top:8px} iframe{height:65vh;background:var(--oat)}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
td{width:50%;padding:9px 12px;text-align:left;border-bottom:1px solid var(--grey);vertical-align:top;overflow-wrap:anywhere}
td+td{border-left:1px solid var(--grey);background:#eaf3fa}
.column-headings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--navy);color:white;border-radius:6px;overflow:hidden}
.column-headings h2{margin:0;padding:11px 12px;font-size:16px}
.column-headings h2+h2{border-left:1px solid var(--light-teal);background:#315e78}
.field-label{display:block;color:var(--bright-navy);font-size:12px;font-weight:700;margin-bottom:2px}
.comparison-group{margin:16px 0}
.comparison-group h3{background:var(--oat);border-left:3px solid var(--lime);margin:0;padding:8px 10px}
td.crm-differs{background:#fde8e7;box-shadow:inset 3px 0 #b42318}
td.crm-review{background:#dcebf5}
.field-status{display:block;font-size:12px;font-weight:700;margin-top:3px}
.crm-differs .field-status{color:#8f1f17}
.crm-review .field-status{color:var(--bright-navy)}
.evidence{margin:8px 0 0;font-size:13px}
.diagnostics{margin-top:12px;padding:10px;border:1px solid var(--grey);border-radius:6px}
.diagnostics button{margin:8px 0 0;padding:6px 10px;background:var(--navy);color:white;border:0;border-radius:4px;cursor:pointer}
.review{background:var(--light-green);color:var(--navy);padding:6px 9px;border-left:3px solid var(--dark-green)}
summary{cursor:pointer;color:var(--bright-navy)}
pre{white-space:pre-wrap;overflow-wrap:anywhere} label{display:block}
@media(max-width:740px){main{grid-template-columns:1fr}.document-panel{position:static}}
</style>
</head>
<body>
<header class="masthead">
<h1>Sales Order PO Review</h1>
<p>Read-only comparison · Zoho OCR · Auto-scan</p>
</header>
<main>
<section class="document-panel">
<h2>Original purchase order</h2>
<p id="attachment-status" role="status">Waiting for Zoho…</p>
<div id="preview"></div>
</section>
<section>
<div class="column-headings">
<h2>Purchase Order fields</h2>
<h2>CRM Sales Order fields</h2>
</div>
<p id="order-status" role="status">Waiting for Zoho…</p>
<p id="scan-status" role="status">Waiting for the Sales Order attachment…</p>
<details class="diagnostics" id="diagnostics" hidden>
<summary>Scan diagnostics</summary>
<button id="copy-diagnostics" type="button">Copy diagnostic report</button>
<span id="diagnostic-status" role="status"></span>
<pre id="diagnostic-report"></pre>
</details>
<div id="results"></div>
</section>
</main>
<script>
(() => {
  "use strict";
  const el = id => document.getElementById(id);
  const attachmentStatus = el("attachment-status");
  const orderStatus = el("order-status");
  const scanStatus = el("scan-status");
  const results = el("results");
  const preview = el("preview");
  let objectUrl, previewId, order, result;
  let recordRequest = 0, fileRequest = 0, scanRequest = 0;
  const diagnosticVersion = "19";
  const diagnosticReport = el("diagnostic-report");
  let trace = [];

  function traceStep(stage, state, code = "") {
    trace.push({ stage, state, ...(code ? { code } : {}) });
    diagnosticReport.textContent = JSON.stringify({
      widgetVersion: diagnosticVersion,
      functionApiName: "scan_sales_order_po",
      argumentNames: ["salesOrderId"],
      steps: trace
    }, null, 2);
  }

  function showDiagnostics() {
    el("diagnostics").hidden = false;
    el("diagnostics").open = true;
  }

  el("copy-diagnostics").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(diagnosticReport.textContent);
      el("diagnostic-status").textContent = " Report copied.";
    } catch {
      const range = document.createRange();
      range.selectNodeContents(diagnosticReport);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      el("diagnostic-status").textContent = " Press Ctrl+C to copy the selected report.";
    }
  });

  function paragraph(parent, text, tone = "") {
    const p = document.createElement("p");
    p.textContent = text;
    p.className = tone;
    parent.append(p);
  }

  function title(parent, text) {
    const heading = document.createElement("h3");
    heading.textContent = text;
    parent.append(heading);
  }

  function comparisonGroup(name, rows) {
    const group = document.createElement("div");
    group.className = "comparison-group";
    title(group, name);
    const grid = document.createElement("table");
    grid.setAttribute("aria-label", name + " · Purchase Order and CRM comparison");
    const body = grid.createTBody();
    for (const [label, poValue, crmValue, status] of rows) {
      const row = body.insertRow();
      for (const [column, value] of [poValue, crmValue].entries()) {
        const cell = row.insertCell();
        const caption = document.createElement("span");
        caption.className = "field-label";
        caption.textContent = label;
        cell.append(caption, document.createTextNode(value == null || value === "" ? "—" : String(value)));
        if (column !== 1 || !status || status === "Match" || status === "CRM only") continue;
        cell.className = ["Differs", "CRM blank", "No matching CRM product"].includes(status)
          ? "crm-differs" : "crm-review";
        const badge = document.createElement("span");
        badge.className = "field-status";
        badge.textContent = status;
        cell.append(badge);
      }
    }
    group.append(grid);
    results.append(group);
    return group;
  }

  const key = value => String(value ?? "").trim().toUpperCase();
  function normalized(value) {
    return key(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N} ]/gu, " ").replace(/\s+/g, " ").trim();
  }
  function streetKey(value) {
    const replacements = { STREET: "ST", DRIVE: "DR", ROAD: "RD", AVENUE: "AVE",
      PARKWAY: "PKWY", BOULEVARD: "BLVD", SUITE: "STE", APARTMENT: "APT" };
    return normalized(value).split(" ").map(word => replacements[word] || word).join(" ");
  }
  function zipKey(value) {
    const zip = key(value).replace(/\s/g, "");
    return /^\d{5}-\d{4}$/.test(zip) ? zip.slice(0, 5) : zip;
  }
  const usRegions = {
    ALABAMA:"AL", ALASKA:"AK", ARIZONA:"AZ", ARKANSAS:"AR", CALIFORNIA:"CA",
    COLORADO:"CO", CONNECTICUT:"CT", DELAWARE:"DE", "DISTRICT OF COLUMBIA":"DC",
    FLORIDA:"FL", GEORGIA:"GA", HAWAII:"HI", IDAHO:"ID", ILLINOIS:"IL",
    INDIANA:"IN", IOWA:"IA", KANSAS:"KS", KENTUCKY:"KY", LOUISIANA:"LA",
    MAINE:"ME", MARYLAND:"MD", MASSACHUSETTS:"MA", MICHIGAN:"MI", MINNESOTA:"MN",
    MISSISSIPPI:"MS", MISSOURI:"MO", MONTANA:"MT", NEBRASKA:"NE", NEVADA:"NV",
    "NEW HAMPSHIRE":"NH", "NEW JERSEY":"NJ", "NEW MEXICO":"NM", "NEW YORK":"NY",
    "NORTH CAROLINA":"NC", "NORTH DAKOTA":"ND", OHIO:"OH", OKLAHOMA:"OK",
    OREGON:"OR", PENNSYLVANIA:"PA", "RHODE ISLAND":"RI", "SOUTH CAROLINA":"SC",
    "SOUTH DAKOTA":"SD", TENNESSEE:"TN", TEXAS:"TX", UTAH:"UT", VERMONT:"VT",
    VIRGINIA:"VA", WASHINGTON:"WA", "WEST VIRGINIA":"WV", WISCONSIN:"WI", WYOMING:"WY"
  };
  const canadianRegions = {
    ALBERTA:"AB", "BRITISH COLUMBIA":"BC", MANITOBA:"MB", "NEW BRUNSWICK":"NB",
    "NEWFOUNDLAND AND LABRADOR":"NL", NEWFOUNDLAND:"NL", "NOVA SCOTIA":"NS",
    "NORTHWEST TERRITORIES":"NT", NUNAVUT:"NU", ONTARIO:"ON",
    "PRINCE EDWARD ISLAND":"PE", QUEBEC:"QC", SASKATCHEWAN:"SK", YUKON:"YT"
  };
  const regionEntries = Object.entries({ ...usRegions, ...canadianRegions })
    .sort(([a], [b]) => b.length - a.length);
  const usCodes = new Set(Object.values(usRegions));
  const canadianCodes = new Set(Object.values(canadianRegions));

  function cityKey(value) {
    const text = normalized(value);
    for (const [name, code] of regionEntries) {
      if (text === name) return code;
      if (text.endsWith(" " + name)) return text.slice(0, -name.length) + code;
    }
    return text;
  }
  function countryKey(value) {
    const text = normalized(value);
    if (["US", "USA", "U S A", "UNITED STATES", "UNITED STATES OF AMERICA"].includes(text)) return "US";
    return text === "CANADA" ? "CA" : text;
  }
  function poCountry(address) {
    if (!address) return {};
    const zip = key(address.postal_code).replace(/\s/g, "");
    const byZip = /^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z]\d[ABCEGHJ-NPRSTV-Z]\d$/.test(zip) ? "CA"
      : /^\d{5}(?:-?\d{4})?$/.test(zip) ? "US" : "";
    const region = cityKey(address.city_region).split(" ").at(-1);
    const byRegion = canadianCodes.has(region) ? "CA" : usCodes.has(region) ? "US" : "";
    const printed = address.country_as_printed;
    const printedCode = countryKey(printed);
    const conflict = Boolean(byZip && byRegion && byZip !== byRegion) ||
      (["CA", "US"].includes(printedCode) &&
        [byZip, byRegion].some(code => code && code !== printedCode));
    if (conflict) return { value: printed, label: printed || "Conflicting address clues", conflict };
    if (printed) return { value: printed, label: printed };
    const code = byZip || byRegion;
    const value = code === "CA" ? "Canada" : code === "US" ? "United States" : null;
    return { value, label: value ? value + " (inferred)" : null };
  }
  function crmAddress(prefix) {
    return {
      street: order?.[prefix + "_Street"],
      city: [order?.[prefix + "_City"], order?.[prefix + "_State"]].filter(Boolean).join(", "),
      zip: order?.[prefix + "_Code"],
      country: order?.[prefix + "_Country"] ?? order?.[prefix + "Country"]
    };
  }
  function showAddress(role, prefix) {
    const entry = result?.[role];
    const po = entry?.address;
    const crm = crmAddress(prefix);
    const account = order?.[role === "billing" ? "Bill_to_Account" : "Ship_to_Account"]?.name;
    const fields = [
      ["Company / account", po?.name, account, normalized],
      ["Street", po?.street, crm.street, streetKey],
      ["City / region", po?.city_region, crm.city, cityKey],
      ["Postal code", po?.postal_code, crm.zip, zipKey]
    ];
    const rows = fields.map(([name, left, right, normalize]) => [
      name, left, right,
      !result ? "" : !left ? "Needs review" : !right ? "CRM blank"
        : normalize(left) === normalize(right) ? "Match"
        : name === "Company / account" ? "Verify account name" : "Differs"
    ]);
    const country = poCountry(po);
    rows.push(["Country", country.label, crm.country,
      !result ? "" : country.conflict || !country.value ? "Needs review"
        : !crm.country ? "CRM blank"
        : countryKey(country.value) === countryKey(crm.country) ? "Match" : "Differs"]);
    const group = comparisonGroup(prefix, rows);
    if (entry?.evidence.length) {
      const details = document.createElement("details");
      details.className = "evidence";
      const label = document.createElement("summary");
      label.textContent = "PO evidence";
      details.append(label);
      for (const evidence of entry.evidence) {
        paragraph(details, evidence.label);
        const block = document.createElement("pre");
        block.textContent = evidence.source_lines.join("\n");
        details.append(block);
      }
      group.append(details);
    }
  }

  function decimal(value) {
    if (value === null || value === undefined || value === "") return null;
    const n = Number(String(value).replace(/[$,]/g, ""));
    return Number.isFinite(n) ? n : null;
  }
  function numericCheck(a, b) {
    const left = decimal(a), right = decimal(b);
    return left === null || right === null ? "Needs review"
      : Math.abs(left - right) < 0.000001 ? "Match" : "Differs";
  }
  function crmItems() {
    if (Array.isArray(order?.Ordered_Items)) return order.Ordered_Items.map(line => ({
      name: line.Product_Name?.name, qty: line.Quantity, price: line.List_Price,
      code: line.Product_Name?.Product_Code,
      amount: line.Total_After_Discount ?? line.Total,
      net: line.Net_Total, discount: line.Discount
    }));
    if (Array.isArray(order?.Product_Details)) return order.Product_Details.map(line => ({
      name: line.product?.name, qty: line.quantity, price: line.list_price,
      code: line.product?.Product_Code ?? line.product?.product_code,
      amount: line.total_after_discount ?? line.total,
      net: line.net_total, discount: line.Discount ?? line.discount
    }));
    return null;
  }
  function renderItems() {
    const current = crmItems();
    const complete = current && !order?.$has_more?.Ordered_Items;
    const items = result?.items ?? [];
    const matches = items.map(item => {
      const sku = key(item.sku);
      return current?.map((line, index) => sku &&
        [line.name, line.code].some(value => key(value) === sku) ? index : -1)
        .filter(index => index >= 0) ?? [];
    });
    const counts = new Map();
    for (const pair of matches) {
      for (const index of pair) counts.set(index, (counts.get(index) || 0) + 1);
    }
    for (const [i, item] of items.entries()) {
      const pair = matches[i];
      const index = pair[0];
      const duplicate = pair.length > 1 || counts.get(index) > 1;
      const line = pair.length === 1 && !duplicate ? current[index] : undefined;
      const sku = key(item.sku);
      const similar = !pair.length && sku.length >= 6 && current
        ? [...new Set(current.filter(candidate => [candidate.name, candidate.code].some(value => {
          const code = key(value);
          return code.length === sku.length && /^[A-Z0-9._/-]+$/.test(code) &&
            [...sku].filter((char, pos) => char !== code[pos]).length === 1;
        })).map(candidate => candidate.name).filter(Boolean))]
        : [];
      const productStatus = !sku || duplicate ? "Needs review"
        : line ? "Match" : similar.length === 1 ? "Possible OCR misread · verify SKU"
        : complete && item.arithmetic_ok ? "No matching CRM product" : "Needs review";
      const check = (poValue, crmValue) =>
        line && item.arithmetic_ok ? numericCheck(poValue, crmValue) : "Needs review";
      const discount = decimal(item.discount_percent) === null || !item.arithmetic_ok ? null
        : Math.round(Number(item.unit_price) * Number(item.quantity) * Number(item.discount_percent)) / 100;
      const rows = [
        ["Supplier SKU / product", item.sku, line?.name ?? (similar.length === 1 ? similar[0] : null), productStatus],
        ["Quantity", item.quantity, line?.qty, check(item.quantity, line?.qty)],
        ["Unit price", item.unit_price, line?.price, check(item.unit_price, line?.price)],
        ["Line amount", item.amount, line?.amount, check(item.amount, line?.amount)]
      ];
      if (item.buyer_code) rows.splice(1, 0, ["Buyer item code", item.buyer_code, null, ""]);
      if (item.discount_percent != null || line?.discount != null) {
        rows.push(["Discount (PO % / CRM amount)", item.discount_percent == null ? null : item.discount_percent + "%",
          line?.discount, check(discount, line?.discount)]);
      }
      if (line?.net != null) rows.push(["Net total", null, line.net, "CRM only"]);
      const group = comparisonGroup("Product line " + item.line, rows);
      const details = document.createElement("details");
      details.className = "evidence";
      const summary = document.createElement("summary");
      summary.textContent = "Printed PO row";
      details.append(summary);
      paragraph(details, item.source);
      group.append(details);
    }
    if (current) {
      current.forEach((line, index) => {
        if (counts.has(index)) return;
        const status = result ? "No matching PO item read" : "";
        comparisonGroup("CRM product line " + (index + 1), [
          ["Supplier SKU / product", null, line.name, status],
          ["Quantity", null, line.qty, ""],
          ["Unit price", null, line.price, ""],
          ["Line amount", null, line.amount, ""]
        ]);
      });
      if (!complete) paragraph(results, "CRM returned a partial product list.", "review");
    } else {
      paragraph(results, "CRM product lines are unavailable in this view.", "review");
    }
    for (const warning of result?.warnings ?? []) paragraph(results, warning, "review");
  }

  function renderResults() {
    results.replaceChildren();
    if (!order) return;
    const poNumbers = result?.po_numbers ?? [];
    const po = poNumbers.length === 1 ? poNumbers[0] : "";
    const crmPo = order.Purchase_Order;
    const crmCurrency = order.Currency;
    const poCurrency = result?.amounts.total?.currency;
    const rows = [
      ["PO number", poNumbers.join(" / "), crmPo,
        !result ? "" : !po ? "Needs review" : !crmPo ? "CRM blank"
          : key(po) === key(crmPo) ? "Match" : "Differs"],
      ["Currency", poCurrency, crmCurrency,
        !result ? "" : !poCurrency ? "Needs review" : !crmCurrency ? "CRM blank"
          : key(poCurrency) === key(crmCurrency) ? "Match" : "Differs"]
    ];
    const amount = result?.amounts.total;
    const comparable = amount && !amount.ambiguous && !(amount.currency && crmCurrency && amount.currency !== crmCurrency);
    const current = order.Grand_Total;
    rows.push(["Total", amount?.value, current, !result ? "" : !comparable ? "Needs review"
      : current == null || current === "" ? "CRM blank" : numericCheck(amount.value, current)]);
    comparisonGroup("PO reference and totals", rows);

    comparisonGroup("Sales Order accounts", [
      ["Account", null, order.Account_Name?.name, "CRM only"],
      ["End user account", null, order.Existing_End_User_Account?.name, "CRM only"]
    ]);
    showAddress("billing", "Billing");
    showAddress("shipping", "Shipping");
    if (result?.invoice_routing.length) {
      paragraph(results, "Invoice routing on the PO · " +
        result.invoice_routing.flatMap(item => item.source_lines).join(" · "), "muted");
    }
    renderItems();
  }

  function clearFile() {
    ++scanRequest;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = undefined;
    previewId = undefined;
    result = undefined;
    preview.replaceChildren();
    results.replaceChildren();
    scanStatus.textContent = "Waiting for the selected attachment…";
  }
  async function selectFile(blob, name, request) {
    const bytes = new Uint8Array(await blob.slice(0, 8).arrayBuffer());
    if (request !== fileRequest) return;
    let mime;
    if (String.fromCharCode(...bytes.slice(0, 5)) === "%PDF-") mime = "application/pdf";
    else if ([137, 80, 78, 71, 13, 10, 26, 10].every((v, i) => bytes[i] === v)) mime = "image/png";
    else if (bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255) mime = "image/jpeg";
    else throw new Error("The file is not a supported PDF, PNG, or JPEG.");
    objectUrl = URL.createObjectURL(blob.slice(0, blob.size, mime));
    const open = document.createElement("a");
    open.href = objectUrl;
    open.target = "_blank";
    open.rel = "noopener";
    open.textContent = "Open original in a new tab";
    const viewer = document.createElement(mime === "application/pdf" ? "iframe" : "img");
    viewer.title = "Original purchase order";
    if (viewer.tagName === "IMG") viewer.alt = "Original purchase order";
    viewer.src = mime === "application/pdf"
      ? objectUrl + "#toolbar=0&navpanes=0&view=FitH"
      : objectUrl;
    preview.append(open, viewer);
  }

  function parseOcr(raw) {
    // Keep lines and column spacing. Zoho may return escaped or literal line breaks.
    const text = raw.replace(/\\r\\n|\\n|\\r/g, "\n").replace(/\r\n?/g, "\n")
      .replace(/\\t|\t/g, "    ").replace(/\u00a0/g, " ");
    const lines = text.split(/\n|\f/);
    const warnings = [];
    const evidence = { billing: [], shipping: [], invoice_routing: [] };
    const heading = /\b(?<label>shipping\s+address|ship(?:ped)?\s+to(?:\s+address)?|delivery\s+address|deliver\s+to|destination\s+address|bill(?:ing\s+address|\s+to)|invoice\s+to|invoices\s+sent)\b(?:\s*\/\s*(?:exp[ée]dier\s+[àa]|facturer\s+[àa]))?\s*:?/gi;
    const postal = /^(?<place>.+?)\s+(?<zip>[A-Z]\d[A-Z]\s?\d[A-Z]\d|\d{5}(?:-\d{4})?)(?:\s+(?<country>USA|US|CANADA|UNITED STATES))?$/i;
    const stop = /^(?:ordered by|remarks|comments to supplier|line\s+(?:item|nbr)|pr no|terms|for questions|supplier|page\s+\d)\b/i;
    const cell = value => value.trim().split(/ {3,}/)[0];
    const street = /^(?:\d+[A-Z]?\s+\S|P\.?\s*O\.?\s+BOX\b)/i;
    const unit = /^(?:STE\.?|SUITE|UNIT|APT\.?|BLDG\.?|FLOOR|#)\s*[\w-]+/i;
    const addressNoise = /^(?:(?:qte|quote)\s*(?:#|no\.?)|vendor\s+(?:fax|phone))/i;
    const hasHeading = value => Array.from(value.matchAll(heading)).length > 0;

    function parseAddress(block) {
      const clean = block.filter(value => !addressNoise.test(value))
        .map(value => value.replace(/^Address\s*:\s*/i, ""));
      const start = clean.findIndex(value => street.test(value));
      if (start < 1) return null;
      for (let i = start + 1; i < clean.length; i++) {
        const match = clean[i].match(postal)?.groups;
        if (!match) continue;
        return {
          name: clean[0], street: [clean[start], ...clean.slice(start + 1, i).filter(value => unit.test(value))].join(", "),
          city_region: match.place.replace(/[, ]+$/, ""), postal_code: match.zip,
          country_as_printed: match.country || null
        };
      }
      return null;
    }

    for (const [index, line] of lines.entries()) {
      const headings = Array.from(line.matchAll(heading));
      for (const [position, mark] of headings.entries()) {
        const label = mark.groups.label.toLowerCase().replace(/\s+/g, " ");
        const role = label === "invoices sent" ? "invoice_routing" : /^(bill|invoice)/.test(label) ? "billing" : "shipping";
        const left = Math.max(0, mark.index - 1);
        const right = headings[position + 1]?.index;
        const first = cell(line.slice(mark.index + mark[0].length, right));
        const block = first ? [first] : [];
        for (const next of lines.slice(index + 1, index + 13)) {
          if (hasHeading(next)) break;
          const value = cell(next.slice(left, right));
          if (!value || addressNoise.test(value)) continue;
          if (stop.test(value)) break;
          block.push(value);
          if (postal.test(value)) break;
        }
        if (block.length) evidence[role].push({
          page: null, label, source_lines: block,
          address: role === "invoice_routing" ? null : parseAddress(block)
        });
      }
    }

    // This form's OCR can read the sold-to and ship-to columns in one stream.
    const bilingualForm = /BON DE COMMANDE/i.test(text) &&
      /Supplier Nbr\s*\/\s*N[°ºo]/i.test(text) && /Bill To\s*\/\s*Facturer/i.test(text);
    if (bilingualForm) {
      const canadianPostal = /^(?<place>.+?)\s+(?<zip>[A-Z]\d[A-Z]\s?\d[A-Z]\d)(?:\s+CANADA)?$/i;
      function canadianBlocks(section) {
        const candidates = [];
        let block = [];
        for (const value of section.split("\n").map(line => line.trim()).filter(Boolean)) {
          const match = value.match(canadianPostal)?.groups;
          if (match) {
            const streetIndex = block.findLastIndex(line => street.test(line));
            const names = block.slice(0, streetIndex)
              .filter(line => !/^(?:ATTN\b|ATTENTION\b)/i.test(line));
            if (streetIndex > 0 && names.length) {
              candidates.push({
                page: null, source_lines: [...block, value],
                address: {
                  name: /\bBUSINESS SOLUTIONS\b/i.test(names[1] || "") ? names.slice(0, 2).join(" ") : names[0],
                  street: [block[streetIndex], ...block.slice(streetIndex + 1).filter(line => unit.test(line))].join(", "),
                  city_region: match.place.replace(/[, ]+$/, ""),
                  postal_code: match.zip,
                  country_as_printed: /\sCANADA$/i.test(value) ? "Canada" : null
                }
              });
            }
            block = [];
          } else if (/^(USA|UNITED STATES|CANADA)$/i.test(value) || postal.test(value)) {
            block = [];
          } else {
            block.push(value);
          }
        }
        return candidates;
      }
      const shippingSection = text.match(/Ship To\s*\/\s*Exp[ée]dier\s+[àa]\s*:\s*([\s\S]*?)Supplier Nbr\s*\//i)?.[1];
      const billingSection = text.match(/Bill To\s*\/\s*Facturer\s+[àa]\s*:\s*([\s\S]*?)(?:\nTerms\s*\/|\nLine Nbr\s*\/)/i)?.[1];
      // Apply the flattened form rules only when the specific merged-column layout is present.
      if (shippingSection && billingSection && canadianBlocks(shippingSection).length > 1) {
        const bill = canadianBlocks(billingSection);
        const signature = item => streetKey(item.address.street) + "|" + zipKey(item.address.postal_code);
        const repeatedBilling = bill.length === 1 ? signature(bill[0]) : null;
        const ship = repeatedBilling ? canadianBlocks(shippingSection)
          .filter(item => signature(item) !== repeatedBilling) : [];
        evidence.billing = bill.map(item => ({ ...item, label: "Bill To / Facturer à" }));
        evidence.shipping = ship.map(item => ({ ...item, label: "Ship To / Expédier à" }));
        if (bill.length !== 1 || ship.length !== 1) warnings.push("The bilingual address columns could not be separated confidently.");
      }
    }

    const output = { invoice_routing: evidence.invoice_routing, catalog_loaded: false };
    for (const role of ["billing", "shipping"]) {
      const found = [...new Map(evidence[role].filter(entry => entry.address)
        .map(entry => [JSON.stringify(entry.address), entry.address])).values()];
      output[role] = { address: found.length === 1 ? found[0] : null, evidence: evidence[role] };
    }

    const decimal = value => value?.replace(/,/g, "") ?? null;
    const numberPattern = String.raw`(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?`;
    const money = String.raw`(?:\d{1,3}(?:,\d{3})+|\d+)\.\d{2,4}`;
    const units = "(?:EACH|EA|PCS?|UNIT|SET|YR|MO)";
    const tail = new RegExp(
      "\\s+(?<qty>" + numberPattern + ")\\s*(?:" + units + ")?\\s+\\$?(?<price>" + money +
      ")\\s*(?:" + units + ")?\\s+(?:(?<discount>" + numberPattern + ")%\\s+)?\\$?(?<amount>" + money + ")\\s*$", "i");
    const xeroxTail = new RegExp("\\s+" + units + "\\s+(?<qty>" + numberPattern +
      ")\\s+(?:[A-Z][A-Z0-9-]+\\s+)?\\$?(?<price>" + money + ")\\s+\\$?(?<amount>" + money + ")\\s*$", "i");
    const imageTechTail = new RegExp("\\s+(?<qty>" + numberPattern + ")\\s*(?:EA|EACH|A)?\\s+\\$?(?<price>" +
      money + ")\\s+(?:0(?:[.]0+)?%?\\s+)?\\$?(?<amount>" + money + ")\\s*$", "i");
    const totalPattern = new RegExp("\\b(?<label>total\\s+purchase\\s+order|grand\\s+total|total\\s+amount|" +
      "po\\s+total(?:\\s*/\\s*totale?\\s+du)?|sub\\s*total|freight|shipping\\s+charge|sales\\s+tax|tax(?:\\s*/\\s*taxe)?|total)" +
      "\\s*:?\\s*(?<currency>USD|CAD)?\\s*\\$?\\s*(?<value>" + money + ")\\s*$", "i");
    const currencyAmount = new RegExp("\\b(?<currency>USD|CAD)\\s+\\$?(?<value>" + money + ")\\s*$", "i");
    const poNumber = /\b(?:purchase\s+order\s*(?:no\.?|number|#)?|order\s+number)\s*:?\s+(?<value>[A-Z0-9][A-Z0-9/-]*\d[A-Z0-9/-]*)\b/i;
    const skuPattern = /^[A-Z0-9][A-Z0-9._/-]*$/i;
    const amounts = {}, items = [], poNumbers = new Set();
    const imageTechForm = /\bBP\s+Catalog\b/i.test(text) && /\bQuantity\s+UoM\b/i.test(text);
    if (imageTechForm) {
      const header = lines.findIndex(line => /PURCHASE ORDER/i.test(line));
      const next = lines.slice(header + 1, header + 5);
      const number = next.map(line => line.match(/\b(\d{5,})\s+\d{1,2}\/\d{1,2}\/\d{4}\b/)?.[1]).find(Boolean);
      if (number) poNumbers.add(number);
    }
    if (bilingualForm) {
      const headerId = text.match(/(?:^|\n)\s*(\d{5,})\s*PURCHASE ORDER\s*\/\s*BON DE COMMANDE\b/i)?.[1];
      if (headerId) poNumbers.add(headerId);
    }
    let layout, previous, pendingTotal = false;
    function addAmount(label, value, currency) {
      const key = label.toLowerCase().replace(/\s/g, "");
      const name = key.startsWith("pototal") ? "total" : key.startsWith("tax/") ? "tax"
        : ({ totalpurchaseorder: "total", grandtotal: "total", totalamount: "total", salestax: "tax", shippingcharge: "freight" })[key] || key;
      if (!amounts[name]) amounts[name] = { value: decimal(value), currency: currency?.toUpperCase() };
      else if (amounts[name].value !== decimal(value)) amounts[name].ambiguous = true;
    }

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) continue;
      const po = line.match(poNumber)?.groups;
      if (po) poNumbers.add(po.value);
      const printedTotal = line.match(totalPattern)?.groups;
      const separateTotal = pendingTotal && line.match(currencyAmount)?.groups;
      pendingTotal = /\bTOTAL AMOUNT\s*$/i.test(line);
      if (printedTotal) addAmount(printedTotal.label, printedTotal.value, printedTotal.currency);
      if (separateTotal) addAmount("total", separateTotal.value, separateTotal.currency);
      const upper = line.toUpperCase();
      if (imageTechForm && /BP\s+CATALOG/.test(upper) && /QUANTITY/.test(upper) && /PRICE/.test(upper)) {
        layout = "imageTech"; previous = null; continue;
      }
      if (upper.includes("LINE ITEM DETAILS") || /SUPPLIER.*BUYER PART.*QTY/.test(upper)) { layout = "konica"; previous = null; continue; }
      if ((/SUPPLIER PART/.test(upper) && /ITEM NBR|QTY/.test(upper) && /PRICE|PRIX/.test(upper)) ||
          (bilingualForm && /FOURNISSEUR\s+DUE\s*\/.*QTY\s*\/.*PRICE\s*\/\s*PRIX/.test(upper))) {
        layout = "bilingual"; previous = null; continue;
      }
      if (/ITEM DESCRIPTION/.test(upper) && /EXTENSION/.test(upper) && /QUANTITY/.test(upper)) { layout = "xerox"; previous = null; continue; }
      if (/\bITEM\b/.test(upper) && /\b(?:QTY|QUANTITY)\b/.test(upper) && /PRICE/.test(upper)) { layout = "standard"; previous = null; continue; }
      if (printedTotal || /^(TERMS AND CONDITIONS|SIGNATURE)/.test(upper)) { layout = null; previous = null; continue; }
      if (!layout) continue;
      const numbered = line.match(/^(?<line>\d{1,6})\s+(?<body>.+)$/)?.groups;
      const row = layout === "imageTech"
        ? { line: numbered?.line || String(items.length + 1), body: (numbered?.body || line).replace(/^Vendor Number\s+/i, "") }
        : numbered;
      if (!row) {
        if (layout === "xerox" && previous && skuPattern.test(line)) {
          const half = line.slice(0, line.length / 2);
          if (half.includes("-") && half + half === line) {
            if (previous.sku && previous.sku !== half) previous.sku_conflict = true;
            else previous.sku = half;
          }
        }
        continue;
      }
      const values = row.body.match(layout === "xerox" ? xeroxTail : layout === "imageTech" ? imageTechTail : tail);
      if (layout === "xerox" && !values && !/^\d{3,}\s+\d{2,}[A-Z]\d+/i.test(line)) continue;
      if (layout === "imageTech" && (!values || !/^[A-Z0-9]+(?:[-._][A-Z0-9]+)+\s/i.test(row.body))) continue;
      const prefix = (values ? row.body.slice(0, values.index) : row.body).trim();
      const cells = prefix.split(/ {2,}/);
      let sku = cells[0]?.split(/\s+/)[0], buyer = null;
      if (layout === "konica") {
        buyer = cells.length >= 3 ? cells.at(-1) : null;
        sku = cells.length >= 3 ? cells.at(-2) : null;
      } else if (layout === "bilingual") {
        const codes = prefix.match(/^(\S+)\s+(\S+)\s+\d{1,2}\/\d{1,2}\/\d{2,4}$/);
        buyer = codes?.[1] ?? sku;
        const rest = cells.slice(1).filter(value => !/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(value));
        sku = codes?.[2] ?? rest.at(-1) ?? null;
      } else if (layout === "xerox") {
        buyer = sku;
        sku = null;
      }
      if (!sku || !skuPattern.test(sku)) sku = null;
      if (!values && !sku && !buyer) continue;
      const nums = values?.groups || {};
      previous = {
        line: row.line, page: null, sku, buyer_code: buyer, catalog_candidates: [],
        quantity: decimal(nums.qty), unit_price: decimal(nums.price), amount: decimal(nums.amount),
        discount_percent: decimal(nums.discount), source: line
      };
      items.push(previous);
    }

    for (const item of items) {
      if (item.sku_conflict) item.sku = null;
      if (!item.sku || item.amount === null) warnings.push("Line " + item.line + ": verify the SKU and amount against the original PO.");
      item.arithmetic_ok = false;
      if (item.quantity !== null && item.unit_price !== null && item.amount !== null) {
        const expected = Number(item.quantity) * Number(item.unit_price) *
          (1 - Number(item.discount_percent ?? 0) / 100);
        item.arithmetic_ok = Math.abs(expected - Number(item.amount)) <= 0.011;
        if (!item.arithmetic_ok) warnings.push("Line " + item.line + ": quantity, unit price, and printed amount do not reconcile. Check for OCR or adjustments.");
      }
    }
    if (!items.length) warnings.push("No item rows could be read confidently. Check the original PO.");
    if (bilingualForm && items.length && items.every(item => item.arithmetic_ok)) {
      const reorderedTotals = text.match(new RegExp(
        "(?:^|\\n)[ \\t]*(" + money + ")[ \\t]*\\n[ \\t]*(" + money +
        ")[ \\t]*\\n[ \\t]*Tax\\s*/\\s*Taxe[ \\t]*\\n[ \\t]*PO Total\\s*/", "i"));
      if (reorderedTotals) {
        const tax = Number(decimal(reorderedTotals[1]));
        const total = Number(decimal(reorderedTotals[2]));
        const subtotal = items.reduce((sum, item) => sum + Number(item.amount), 0);
        if (Math.abs(subtotal + tax - total) <= 0.011) {
          const currency = text.match(/Currency\s*\/\s*Argent\s*:\s*(USD|CAD)/i)?.[1];
          addAmount("tax", reorderedTotals[1], currency);
          addAmount("total", reorderedTotals[2], currency);
        } else warnings.push("The separated tax and total values do not reconcile with the extracted lines.");
      }
    }
    if (lines.filter(line => line.trim()).length < 3) warnings.push("Zoho returned little or no line structure. Check the original PO.");
    return { ...output, items, amounts, po_numbers: [...poNumbers], warnings };
  }

  async function showAttachment(orderPath, id, name) {
    if (previewId === id) return;
    previewId = id;
    const request = ++fileRequest;
    preview.replaceChildren();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = undefined;
    attachmentStatus.textContent = "Loading the CRM attachment preview…";
    try {
      const response = await zrc.get(orderPath + "/Attachments/" + id, { responseType: "blob" });
      if (request !== fileRequest) return;
      if (response.status !== 200 || !(response.data instanceof Blob)) {
        throw Object.assign(new Error("File download failed."), { status: response.status });
      }
      await selectFile(response.data, name, request);
      if (request === fileRequest) {
        attachmentStatus.textContent = name;
        traceStep("CRM attachment preview", "loaded");
      }
    } catch (error) {
      if (request === fileRequest) {
        previewId = undefined;
        traceStep("CRM attachment preview", "failed", errorCode(error));
        showDiagnostics();
        attachmentStatus.textContent = "CRM attachment preview unavailable (" + errorCode(error) + "). The OCR status is shown on the right.";
      }
    }
  }

  async function listOrderAttachments(orderPath) {
    try {
      const response = await zrc.get(orderPath + "/Attachments", {
        params: { fields: "id,File_Name", per_page: 200 }
      });
      if (![200, 204].includes(response.status)) {
        throw Object.assign(new Error(), { status: response.status, details: response.data });
      }
      return { attachments: response.data ?? {}, route: "CRM REST" };
    } catch (firstError) {
      const api = window.ZOHO?.CRM?.API;
      if (!api?.getRelatedRecords) throw firstError;
      let fallback;
      try {
        fallback = await api.getRelatedRecords({
          Entity: "Sales_Orders",
          RecordID: orderPath.split("/").pop(),
          RelatedList: "Attachments",
          page: 1,
          per_page: 200
        });
      } catch {
        throw firstError;
      }
      if (!Array.isArray(fallback?.data)) throw firstError;
      return { attachments: fallback, route: "CRM related-list SDK", firstFailure: errorCode(firstError) };
    }
  }

  async function previewOrderAttachment(orderPath, request, poReference) {
    try {
      const { attachments, route, firstFailure } = await listOrderAttachments(orderPath);
      if (request !== recordRequest) return;
      if (firstFailure) traceStep("CRM attachment list", "REST failed; SDK fallback used", firstFailure);
      traceStep("CRM attachment list", route + " returned a response");
      if (previewId) return;
      const files = (attachments.data ?? []).filter(file =>
        /^\d{10,25}$/.test(String(file.id)) && /\.(pdf|png|jpe?g)$/i.test(file.File_Name ?? ""));
      const exact = poReference ? files.filter(file =>
        key(file.File_Name.trim().replace(/\.[^.]+$/, "")) === poReference) : [];
      const selected = !attachments.info?.more_records
        ? files.length === 1 ? files[0] : exact.length === 1 ? exact[0] : undefined
        : undefined;
      if (selected) {
        traceStep("CRM attachment selection", "one eligible file selected");
        void showAttachment(orderPath, String(selected.id), selected.File_Name);
      } else {
        traceStep("CRM attachment selection", files.length ? "ambiguous or incomplete list" : "no supported files");
        attachmentStatus.textContent = files.length
          ? "Multiple files are possible. Waiting for the scanner to identify the PO."
          : "No supported file was returned by the CRM attachment list.";
      }
    } catch (error) {
      if (request === recordRequest && !previewId) {
        traceStep("CRM attachment list", "failed", errorCode(error));
        showDiagnostics();
        attachmentStatus.textContent = "CRM attachment list unavailable (" + errorCode(error) + ").";
      }
    }
  }

  function parseFunctionString(text) {
    try { return JSON.parse(text); } catch {
      // Some return strings contain literal line breaks inside the quoted OCR text.
      // Escape only control characters inside strings, leaving the JSON structure intact.
      let quoted = false;
      let escaped = false;
      let fixed = "";
      for (const char of text) {
        if (quoted && !escaped && char.charCodeAt(0) < 32) {
          fixed += JSON.stringify(char).slice(1, -1);
          continue;
        }
        fixed += char;
        if (escaped) escaped = false;
        else if (quoted && char === "\\") escaped = true;
        else if (char === '"') quoted = !quoted;
      }
      if (fixed === text) return undefined;
      try { return JSON.parse(fixed); } catch { return undefined; }
    }
  }

  function functionOutput(response) {
    const wrappers = ["output", "response", "body", "data", "details", "crmAPIResponse"];
    const pending = [{ value: response, path: "response", depth: 0 }];
    const shapes = [];
    let apiError;
    let success = false;
    let unreadable = false;
    for (let i = 0; i < pending.length && i < 32; i++) {
      const { value, path, depth } = pending[i];
      if (depth > 8) continue;
      if (typeof value === "string") {
        if (!value.trim()) { shapes.push(path + ": empty string"); continue; }
        const parsed = parseFunctionString(value);
        if (parsed === undefined) { shapes.push(path + ": unreadable text"); unreadable = true; }
        else {
          shapes.push(path + ": JSON string");
          pending.push({ value: parsed, path: path + ".json", depth: depth + 1 });
        }
      } else if (typeof value?.ok === "boolean") {
        traceStep("Function response", "decoded at " + path);
        return value;
      } else if (Array.isArray(value)) {
        shapes.push(path + ": array");
        value.slice(0, 3).forEach((entry, index) =>
          pending.push({ value: entry, path: path + "[" + index + "]", depth: depth + 1 }));
      } else if (value && typeof value === "object") {
        const fields = wrappers.filter(field => Object.prototype.hasOwnProperty.call(value, field));
        shapes.push(path + ": " + (fields.join(", ") || "no known output fields"));
        if (String(value.code ?? "").toLowerCase() === "success") success = true;
        else if (value.code && !apiError) apiError = value;
        fields.forEach(field =>
          pending.push({ value: value[field], path: path + "." + field, depth: depth + 1 }));
      } else {
        shapes.push(path + ": " + (value == null ? "null or missing" : typeof value));
      }
    }
    for (const shape of shapes) traceStep("Function response shape", shape);
    if (apiError) throw Object.assign(new Error(), { diagnostic: errorCode(apiError), zohoCode: apiError.code });
    if (success) {
      throw new Error(unreadable
        ? "Zoho reported success, but the function output could not be decoded."
        : "Zoho reported success, but its response contained no scan result.");
    }
    throw Object.assign(new Error(), { diagnostic: errorCode(response) });
  }

  async function runScan(orderPath, salesOrderId) {
    const request = ++scanRequest;
    scanStatus.textContent = "Zoho is finding and reading the PO…";
    attachmentStatus.textContent = "Zoho is choosing the attachment…";
    traceStep("Standalone function", "requested through Zoho widget SDK");
    try {
      const response = await window.ZOHO.CRM.FUNCTIONS.execute("scan_sales_order_po", {
        arguments: JSON.stringify({ salesOrderId })
      });
      if (request !== scanRequest) return;
      const data = functionOutput(response);
      traceStep("Standalone function", data.ok ? "returned OCR text" : "returned a Deluge error");
      if (String(data?.salesOrderId) === salesOrderId &&
          /^\d{10,25}$/.test(String(data?.attachmentId)) &&
          typeof data?.fileName === "string") {
        void showAttachment(orderPath, String(data.attachmentId), data.fileName);
      } else if (data?.ok) {
        throw new Error("Zoho returned an unverified attachment. Confirm the updated standalone code is saved.");
      }
      if (!data?.ok || typeof data.text !== "string") {
        const error = new Error(data?.error || "Zoho OCR did not return text.");
        if (["order_read", "attachment_list", "attachment_selection", "attachment_download", "ocr"].includes(data?.stage)) {
          traceStep("Deluge stage", data.stage);
        }
        if (/^[A-Z][A-Z0-9_]{0,59}$/.test(data?.code ?? "")) traceStep("Deluge API", "returned an error", data.code);
        throw error;
      }
      result = parseOcr(data.text);
      traceStep("PO parsing", result.items.length ? "item rows found" : "no item rows found");
      renderResults();
      scanStatus.textContent = "Scan complete. Review differences and any unconfirmed fields.";
    } catch (error) {
      if (request !== scanRequest) return;
      if (attachmentStatus.textContent === "Zoho is choosing the attachment…") {
        attachmentStatus.textContent = "Waiting for the CRM attachment preview…";
      }
      const code = error.diagnostic || errorCode(error);
      traceStep("Scan", "failed", code);
      showDiagnostics();
      const inactive = error.zohoCode === "NOT_ACTIVE" || /\bNOT_ACTIVE\b/.test(code);
      scanStatus.textContent = inactive
        ? "Zoho blocked this call before Deluge ran (NOT_ACTIVE). Check that the function is Active and REST API OAuth 2.0 is enabled in this CRM environment."
        : "Scan failed. " + (error instanceof Error && !error.diagnostic && !error.code
          ? error.message : "Zoho function error (" + code + ").");
    }
  }

  function errorCode(error) {
    const status = Number(error?.status || error?.response?.status || 0);
    const candidate = error?.code || error?.details?.code || error?.details?.data?.code
      || error?.response?.data?.code || error?.data?.code || error?.name || "UNKNOWN";
    const code = /^[A-Za-z][A-Za-z0-9_]{0,79}$/.test(String(candidate)) ? candidate : "UNKNOWN";
    return [status || "no HTTP status", code].join(", ");
  }

  async function loadOrder(context) {
    const request = ++recordRequest;
    ++fileRequest;
    clearFile();
    trace = [];
    el("diagnostics").hidden = true;
    el("diagnostics").open = false;
    el("diagnostic-status").textContent = "";
    traceStep("Widget", "opened");
    order = undefined;
    const native = context?.Entity === "Sales_Orders" ? context.EntityId : undefined;
    const id = context?.salesOrderId ?? context?.data?.salesOrderId ?? (Array.isArray(native) ? native[0] : native);
    if (!/^\d+$/.test(String(id))) {
      orderStatus.textContent = "No Sales Order ID received. Open Review PO from a Sales Order.";
      traceStep("Sales Order context", "missing or invalid");
      showDiagnostics();
      return;
    }
    if (typeof zrc === "undefined" || typeof zrc.get !== "function") {
      orderStatus.textContent = "The Zoho Request Client did not load.";
      traceStep("Zoho Request Client", "unavailable");
      showDiagnostics();
      return;
    }
    const path = "/crm/v8/Sales_Orders/" + id;
    orderStatus.textContent = "Loading the Sales Order…";
    attachmentStatus.textContent = "Waiting for the Sales Order…";
    try {
      const response = await zrc.get(path);
      if (request !== recordRequest) return;
      order = response.data?.data?.[0];
      if (!order || String(order.id) !== String(id)) {
        order = undefined;
        throw Object.assign(new Error(), { status: response.status, details: response.data });
      }
      orderStatus.textContent = order.Subject || "Current Sales Order";
      traceStep("Sales Order", "read successfully");
      renderResults();
      void runScan(path, String(id));
      void previewOrderAttachment(path, request, key(order.Purchase_Order));
    } catch (error) {
      if (request === recordRequest) {
        orderStatus.textContent = "Sales Order read failed (" + errorCode(error) + ").";
        traceStep("Sales Order", "failed", errorCode(error));
        showDiagnostics();
      }
    }
  }

  if (window.self === window.top) {
    orderStatus.textContent = "Standalone test · open Review PO in Zoho for the Sales Order comparison.";
    attachmentStatus.textContent = "This page loads its attachment inside Zoho CRM."
    return;
  }
  const timer = setTimeout(() => {
    orderStatus.textContent = "Timed out waiting for Zoho record context.";
    attachmentStatus.textContent = "Open this widget from the Sales Order detail page."
  }, 12000);
  const sdk = document.createElement("script");
  sdk.src = "https://live.zwidgets.com/js-sdk/1.5/ZohoEmbededAppSDK.min.js";
  sdk.onerror = () => {
    clearTimeout(timer);
    orderStatus.textContent = "Zoho SDK could not load.";
  };
  sdk.onload = async () => {
    try {
      ZOHO.embeddedApp.on("PageLoad", context => {
        clearTimeout(timer);
        void loadOrder(context);
      });
      await ZOHO.embeddedApp.init();
    } catch {
      clearTimeout(timer);
      orderStatus.textContent = "Zoho SDK could not initialize.";
    }
  };
  document.head.append(sdk);
})();
</script>
</body>
</html>
