<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Order PO Review</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f3f5fa;color:#182230;font:15px system-ui,sans-serif;padding:20px}
h1{margin:0;font-size:25px} h2{margin:0 0 12px;font-size:18px} h3{margin:18px 0 8px;font-size:16px}
p{margin:8px 0} .muted{color:#526174} main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
section{min-width:0;background:white;border:1px solid #dbe2ee;border-radius:12px;padding:16px}
select,input,button{max-width:100%;font:inherit;margin:5px 0} select{width:100%;padding:6px}
button{padding:7px 12px;color:white;background:#214d97;border:0;border-radius:6px;cursor:pointer} button:disabled{opacity:.45;cursor:default}
iframe,img{width:100%;display:block;border:0;margin-top:8px} iframe{height:56vh;background:#f3f5fa}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:7px;text-align:left;border-bottom:1px solid #e4e8f1;vertical-align:top;overflow-wrap:anywhere}
.scroll{overflow:auto} .different{color:#9b3b0a} .match{color:#18613a} .review{color:#634b00} summary{cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere} label{display:block}
@media(max-width:740px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Sales Order PO Review</h1>
<p class="muted">Read-only comparison · Zoho OCR · Auto-scan</p>
<main>
<section>
<h2>Original purchase order</h2>
<p id="attachment-status" role="status">Waiting for Zoho…</p>
<select id="attachments" aria-label="Purchase order attachment" hidden></select>
<div id="preview"></div>
</section>
<section>
<h2>Sales Order comparison</h2>
<p id="order-status" role="status">Waiting for Zoho…</p>
<div id="order-details"></div>
<p id="scan-status" role="status">Waiting for the Sales Order attachment…</p>
<div id="results"></div>
</section>
</main>
<script>
(() => {
  "use strict";
  const el = id => document.getElementById(id);
  const attachmentStatus = el("attachment-status");
  const orderStatus = el("order-status");
  const scanStatus = el("scan-status");
  const results = el("results");
  const picker = el("attachments");
  const preview = el("preview");
  let selectedAttachment, objectUrl, order, result;
  let recordRequest = 0, fileRequest = 0, scanRequest = 0;

  function paragraph(parent, text, tone = "") {
    const p = document.createElement("p");
    p.textContent = text;
    p.className = tone;
    parent.append(p);
  }

  function title(parent, text) {
    const heading = document.createElement("h3");
    heading.textContent = text;
    parent.append(heading);
  }

  function table(parent, headers, rows) {
    const wrapper = document.createElement("div");
    wrapper.className = "scroll";
    const grid = document.createElement("table");
    const header = grid.createTHead().insertRow();
    for (const label of headers) {
      const cell = document.createElement("th");
      cell.scope = "col";
      cell.textContent = label;
      header.append(cell);
    }
    const body = grid.createTBody();
    for (const row of rows) {
      const tr = body.insertRow();
      for (const value of row) tr.insertCell().textContent = value ?? "—";
    }
    wrapper.append(grid);
    parent.append(wrapper);
  }

  const key = value => String(value ?? "").trim().toUpperCase();
  function normalized(value) {
    return key(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N} ]/gu, " ").replace(/\s+/g, " ").trim();
  }
  function streetKey(value) {
    const replacements = { STREET: "ST", DRIVE: "DR", ROAD: "RD", AVENUE: "AVE",
      PARKWAY: "PKWY", BOULEVARD: "BLVD", SUITE: "STE", APARTMENT: "APT" };
    return normalized(value).split(" ").map(word => replacements[word] || word).join(" ");
  }
  function zipKey(value) {
    const zip = key(value).replace(/\s/g, "");
    return /^\d{5}-\d{4}$/.test(zip) ? zip.slice(0, 5) : zip;
  }
  function cityKey(value) {
    const states = {
      ALABAMA: "AL", ARIZONA: "AZ", ARKANSAS: "AR", CALIFORNIA: "CA",
      CONNECTICUT: "CT", FLORIDA: "FL", ILLINOIS: "IL", INDIANA: "IN",
      MICHIGAN: "MI", NEVADA: "NV", "NEW JERSEY": "NJ", "NEW YORK": "NY",
      OHIO: "OH", PENNSYLVANIA: "PA", VIRGINIA: "VA", WISCONSIN: "WI",
      ONTARIO: "ON", QUEBEC: "QC", ALBERTA: "AB", "BRITISH COLUMBIA": "BC"
    };
    const text = normalized(value);
    for (const [name, code] of Object.entries(states)) {
      if (text.endsWith(" " + name)) return text.slice(0, -name.length) + code;
    }
    return text;
  }
  function countryKey(value) {
    const text = normalized(value);
    if (["US", "USA", "U S A", "UNITED STATES", "UNITED STATES OF AMERICA"].includes(text)) return "US";
    return text === "CANADA" ? "CA" : text;
  }
  function crmAddress(prefix) {
    return {
      street: order?.[prefix + "_Street"],
      city: [order?.[prefix + "_City"], order?.[prefix + "_State"]].filter(Boolean).join(", "),
      zip: order?.[prefix + "_Code"],
      country: order?.[prefix + "_Country"] ?? order?.[prefix + "Country"]
    };
  }
  function displayOrder() {
    const target = el("order-details");
    target.replaceChildren();
    if (!order) return;
    const fields = [
      ["Account", order.Account_Name?.name], ["Bill To Account", order.Bill_to_Account?.name],
      ["Ship To Account", order.Ship_to_Account?.name], ["End User Account", order.Existing_End_User_Account?.name],
      ["Billing address", Object.values(crmAddress("Billing")).filter(Boolean).join(", ")],
      ["Shipping address", Object.values(crmAddress("Shipping")).filter(Boolean).join(", ")]
    ];
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Current CRM fields";
    details.append(summary);
    table(details, ["Field", "Sales Order"], fields);
    target.append(details);

    const exportPanel = document.createElement("details");
    const exportLabel = document.createElement("summary");
    exportLabel.textContent = "Show API field JSON for troubleshooting";
    exportPanel.append(exportLabel);
    const shape = order.Ordered_Items ?? order.Product_Details;
    const examples = Array.isArray(shape) ? shape.slice(0, 3).map(line => {
      const example = {};
      for (const [field, value] of Object.entries(line)) {
        if (value && typeof value === "object" && !Array.isArray(value)) {
          example[field] = Object.fromEntries(Object.keys(value).map(nested => [
            nested, nested === "name" && ["Product_Name", "product"].includes(field)
              ? value[nested] : "[redacted]"
          ]));
        } else {
          const safeField = /^(?:quantity|list_price|unit_price|total|total_after_discount|net_total|discount|discount_percent|tax)$/i.test(field);
          example[field] = value === null ? null : safeField && typeof value === "number"
            ? value : typeof value === "string" && safeField && /^-?\d+(?:\.\d+)?$/.test(value)
              ? value : "[redacted]";
        }
      }
      return example;
    }) : [];
    const report = {
      record_keys: Object.keys(order).sort(),
      populated_record_keys: Object.keys(order).filter(field =>
        order[field] !== null && order[field] !== undefined && order[field] !== ""
      ).sort(),
      order_totals: Object.fromEntries(
        ["Currency", "SubTotal", "Sub_Total", "Discounts", "Discount", "Tax",
          "Shipping_Charge", "Adjustment", "Grand_Total"]
          .filter(field => typeof order[field] === "number" ||
            (field === "Currency" && /^[A-Z]{3}$/.test(order[field])))
          .map(field => [field, order[field]])
      ),
      line_item_key: Array.isArray(order.Ordered_Items) ? "Ordered_Items"
        : Array.isArray(order.Product_Details) ? "Product_Details" : null,
      line_item_count: Array.isArray(shape) ? shape.length : null,
      more_ordered_items: order.$has_more?.Ordered_Items ?? null,
      line_examples: examples
    };
    const json = document.createElement("textarea");
    json.readOnly = true;
    json.rows = 12;
    json.style.width = "100%";
    json.setAttribute("aria-label", "Sales Order API field JSON");
    json.value = JSON.stringify(report, null, 2);
    paragraph(exportPanel, "Copy this JSON to share API names and up to three example line items. Record IDs and customer values are omitted. Review product names and prices before sharing.");
    exportPanel.append(json);
    target.append(exportPanel);
  }

  function showAddress(role, prefix) {
    title(results, prefix);
    const entry = result[role];
    const po = entry.address;
    const crm = crmAddress(prefix);
    const account = order?.[role === "billing" ? "Bill_to_Account" : "Ship_to_Account"]?.name;
    const fields = [
      ["Company", po?.name, account, normalized],
      ["Street", po?.street, crm.street, streetKey],
      ["City / region", po?.city_region, crm.city, cityKey],
      ["Postal code", po?.postal_code, crm.zip, zipKey],
      ["Country", po?.country_as_printed, crm.country, countryKey]
    ];
    table(results, ["Field", "PO", "Sales Order", "Check"], fields.map(
      ([name, left, right, normalize]) => [
        name, left || "—", right || "—",
        !left ? "Needs review" : !order ? "PO only" : !right ? "CRM blank"
          : normalize(left) === normalize(right) ? "Match"
          : name === "Company" ? "Verify account name" : "Differs"
      ]
    ));
    if (entry.evidence.length) {
      const details = document.createElement("details");
      const label = document.createElement("summary");
      label.textContent = "PO evidence";
      details.append(label);
      for (const evidence of entry.evidence) {
        paragraph(details, evidence.page ? "Page " + evidence.page + " · " + evidence.label : evidence.label);
        const block = document.createElement("pre");
        block.textContent = evidence.source_lines.join("\n");
        details.append(block);
      }
      results.append(details);
    }
  }

  function decimal(value) {
    if (value === null || value === undefined || value === "") return null;
    const n = Number(String(value).replace(/[$,]/g, ""));
    return Number.isFinite(n) ? n : null;
  }
  function numericCheck(a, b) {
    const left = decimal(a), right = decimal(b);
    return left === null || right === null ? "Needs review"
      : Math.abs(left - right) < 0.000001 ? "Match" : "Differs";
  }
  function crmItems() {
    if (Array.isArray(order?.Ordered_Items)) return order.Ordered_Items.map(line => ({
      name: line.Product_Name?.name, qty: line.Quantity, price: line.List_Price,
      code: line.Product_Name?.Product_Code,
      amount: line.Total_After_Discount ?? line.Total,
      net: line.Net_Total, discount: line.Discount
    }));
    if (Array.isArray(order?.Product_Details)) return order.Product_Details.map(line => ({
      name: line.product?.name, qty: line.quantity, price: line.list_price,
      code: line.product?.Product_Code ?? line.product?.product_code,
      amount: line.total_after_discount ?? line.total,
      net: line.net_total, discount: line.Discount ?? line.discount
    }));
    return null;
  }
  function renderItems() {
    title(results, "Products and line items");
    paragraph(results, "Matches use the printed supplier SKU and CRM Product Name or SKU-style Product Code.", "muted");
    const current = crmItems();
    const complete = current && !order?.$has_more?.Ordered_Items;
    if (!current) paragraph(results, "CRM line items unavailable in this view.", "review");
    else if (!complete) paragraph(results, "CRM returned a partial line-item list.", "review");

    const pairs = result.items.map(item => {
      const names = new Set([item.sku, ...item.catalog_candidates].map(key).filter(Boolean));
      return current?.map((line, index) => {
        const code = key(line.code);
        const skuLike = /^[A-Z0-9][A-Z0-9._/-]*$/.test(code);
        return names.has(key(line.name)) || (skuLike && names.has(code)) ? index : -1;
      })
        .filter(index => index >= 0) || [];
    });
    const counts = new Map();
    for (const matches of pairs) for (const index of matches) counts.set(index, (counts.get(index) || 0) + 1);

    const rows = result.items.map((item, i) => {
      const matches = pairs[i];
      const index = matches[0];
      const duplicate = matches.length > 1 || counts.get(index) > 1;
      const line = matches.length === 1 && !duplicate ? current[index] : undefined;
      const qty = line ? numericCheck(item.quantity, line.qty) : "—";
      const price = line ? numericCheck(item.unit_price, line.price) : "—";
      const amount = line ? numericCheck(item.amount, line.amount) : "—";
      const discount = line && decimal(item.discount_percent) !== null &&
        decimal(item.unit_price) !== null && decimal(item.quantity) !== null
        ? numericCheck(Math.round(decimal(item.unit_price) * decimal(item.quantity) *
          decimal(item.discount_percent)) / 100, line.discount) : null;
      let status = !current ? "PO only" : !item.sku || duplicate || !item.arithmetic_ok ? "Needs review"
        : !line ? (complete ? "No matching CRM product" : "Needs review")
        : [qty, price, amount, discount].includes("Differs") ? "Differs"
        : [qty, price, amount, discount].includes("Needs review") ? "Needs review" : "Match";
      const sku = [item.sku, item.buyer_code && item.buyer_code !== item.sku ? "Buyer: " + item.buyer_code : ""].filter(Boolean).join(" · ");
      return [
        item.line, sku || "—", line?.name || item.catalog_candidates.join(" / ") || "—",
        (item.quantity ?? "—") + " / " + (line?.qty ?? "—"),
        (item.unit_price ?? "—") + " / " + (line?.price ?? "—"),
        (item.amount ?? "—") + " / " + (line?.amount ?? "—"),
        (item.discount_percent == null ? "—" : item.discount_percent + "%") + " / " + (line?.discount ?? "—"),
        line?.net ?? "—", status
      ];
    });

    if (complete && result.items.length) {
      current.forEach((line, index) => {
        if (!counts.has(index)) rows.push(["—", "—", line.name, "— / " + (line.qty ?? "—"),
          "— / " + (line.price ?? "—"), "— / " + (line.amount ?? "—"),
          "— / " + (line.discount ?? "—"), line.net ?? "—", "No matching PO item read"]);
      });
    }
    if (rows.length) table(results, ["Line", "PO SKU", "Product", "Qty PO / CRM",
      "Unit price PO / CRM", "Amount PO / CRM", "Discount PO % / CRM amount", "CRM net", "Check"], rows);
    for (const warning of result.warnings) paragraph(results, warning, "review");
    if (result.items.length) {
      const evidence = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "Printed item rows";
      evidence.append(summary);
      for (const item of result.items) paragraph(evidence, item.page ? "Page " + item.page + " · " + item.source : item.source);
      results.append(evidence);
    }
  }

  function renderResults() {
    results.replaceChildren();
    if (!result) return;
    if (result.po_numbers.length === 1 && order?.Purchase_Order &&
        key(result.po_numbers[0]) !== key(order.Purchase_Order)) {
      paragraph(results, "The printed PO number differs from the Sales Order PO reference. Verify the selected document.", "review");
    }
    showAddress("billing", "Billing");
    showAddress("shipping", "Shipping");
    if (result.invoice_routing.length) {
      paragraph(results, "Invoice routing shown on the PO · " +
        result.invoice_routing.flatMap(item => item.source_lines).join(" · "), "muted");
    }
    renderItems();
    title(results, "PO reference and totals");
    const po = result.po_numbers.length === 1 ? result.po_numbers[0] : "";
    const crmPo = order?.Purchase_Order;
    const crmCurrency = order?.Currency;
    const rows = [["PO number", result.po_numbers.join(" / ") || "—", crmPo || "—",
      !po || !crmPo ? "Needs review" : key(po) === key(crmPo) ? "Match" : "Differs"]];
    for (const [label, k, current] of [
      ["Subtotal", "subtotal", order?.SubTotal ?? order?.Sub_Total],
      ["Tax", "tax", order?.Tax],
      ["Freight", "freight", order?.Shipping_Charge],
      ["Total", "total", order?.Grand_Total]
    ]) {
      const amount = result.amounts[k];
      const comparable = amount && !amount.ambiguous && !(amount.currency && crmCurrency && amount.currency !== crmCurrency);
      rows.push([label, amount ? [amount.currency, amount.value].filter(Boolean).join(" ") : "—",
        current ?? "—", comparable ? numericCheck(amount.value, current) : "Needs review"]);
    }
    if (order && (order.Discounts ?? order.Discount) != null) {
      rows.push(["Order discounts", "—", order.Discounts ?? order.Discount, "CRM value"]);
    }
    table(results, ["Field", "PO", "Sales Order", "Check"], rows);
  }

  function clearFile() {
    ++scanRequest;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = undefined;
    selectedAttachment = undefined;
    result = undefined;
    preview.replaceChildren();
    results.replaceChildren();
    scanStatus.textContent = "Waiting for the selected attachment…";
  }
  async function selectFile(blob, name, request) {
    const bytes = new Uint8Array(await blob.slice(0, 8).arrayBuffer());
    if (request !== fileRequest) return;
    let mime;
    if (String.fromCharCode(...bytes.slice(0, 5)) === "%PDF-") mime = "application/pdf";
    else if ([137, 80, 78, 71, 13, 10, 26, 10].every((v, i) => bytes[i] === v)) mime = "image/png";
    else if (bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255) mime = "image/jpeg";
    else throw new Error("The file is not a supported PDF, PNG, or JPEG.");
    objectUrl = URL.createObjectURL(blob.slice(0, blob.size, mime));
    const open = document.createElement("a");
    open.href = objectUrl;
    open.target = "_blank";
    open.rel = "noopener";
    open.textContent = "Open original in a new tab";
    const viewer = document.createElement(mime === "application/pdf" ? "iframe" : "img");
    viewer.title = "Original purchase order";
    if (viewer.tagName === "IMG") viewer.alt = "Original purchase order";
    viewer.src = objectUrl;
    preview.append(open, viewer);
  }

  function parseOcr(raw) {
    // Keep lines and column spacing. Zoho may return escaped or literal line breaks.
    const text = raw.replace(/\\r\\n|\\n|\\r/g, "\n").replace(/\r\n?/g, "\n")
      .replace(/\\t|\t/g, "    ").replace(/\u00a0/g, " ");
    const lines = text.split(/\n|\f/);
    const warnings = [];
    const evidence = { billing: [], shipping: [], invoice_routing: [] };
    const heading = /\b(?<label>shipping\s+address|ship(?:ped)?\s+to(?:\s+address)?|delivery\s+address|deliver\s+to|destination\s+address|bill(?:ing\s+address|\s+to)|invoice\s+to|invoices\s+sent)\b(?:\s*\/\s*(?:exp[ée]dier\s+[àa]|facturer\s+[àa]))?\s*:?/gi;
    const postal = /^(?<place>.+?)\s+(?<zip>[A-Z]\d[A-Z]\s?\d[A-Z]\d|\d{5}(?:-\d{4})?)(?:\s+(?<country>USA|US|CANADA|UNITED STATES))?$/i;
    const stop = /^(?:ordered by|remarks|comments to supplier|line\s+(?:item|nbr)|pr no|terms|for questions|supplier|page\s+\d)\b/i;
    const cell = value => value.trim().split(/ {3,}/)[0];
    const street = /^(?:\d+[A-Z]?\s+\S|P\.?\s*O\.?\s+BOX\b)/i;
    const unit = /^(?:STE\.?|SUITE|UNIT|APT\.?|BLDG\.?|FLOOR|#)\s*[\w-]+/i;
    const addressNoise = /^(?:(?:qte|quote)\s*(?:#|no\.?)|vendor\s+(?:fax|phone))/i;
    const hasHeading = value => Array.from(value.matchAll(heading)).length > 0;

    function parseAddress(block) {
      const clean = block.filter(value => !addressNoise.test(value))
        .map(value => value.replace(/^Address\s*:\s*/i, ""));
      const start = clean.findIndex(value => street.test(value));
      if (start < 1) return null;
      for (let i = start + 1; i < clean.length; i++) {
        const match = clean[i].match(postal)?.groups;
        if (!match) continue;
        return {
          name: clean[0], street: [clean[start], ...clean.slice(start + 1, i).filter(value => unit.test(value))].join(", "),
          city_region: match.place.replace(/[, ]+$/, ""), postal_code: match.zip,
          country_as_printed: match.country || null
        };
      }
      return null;
    }

    for (const [index, line] of lines.entries()) {
      const headings = Array.from(line.matchAll(heading));
      for (const [position, mark] of headings.entries()) {
        const label = mark.groups.label.toLowerCase().replace(/\s+/g, " ");
        const role = label === "invoices sent" ? "invoice_routing" : /^(bill|invoice)/.test(label) ? "billing" : "shipping";
        const left = Math.max(0, mark.index - 1);
        const right = headings[position + 1]?.index;
        const first = cell(line.slice(mark.index + mark[0].length, right));
        const block = first ? [first] : [];
        for (const next of lines.slice(index + 1, index + 13)) {
          if (hasHeading(next)) break;
          const value = cell(next.slice(left, right));
          if (!value || addressNoise.test(value)) continue;
          if (stop.test(value)) break;
          block.push(value);
          if (postal.test(value)) break;
        }
        if (block.length) evidence[role].push({
          page: null, label, source_lines: block,
          address: role === "invoice_routing" ? null : parseAddress(block)
        });
      }
    }

    const output = { invoice_routing: evidence.invoice_routing, catalog_loaded: false };
    for (const role of ["billing", "shipping"]) {
      const found = [...new Map(evidence[role].filter(entry => entry.address)
        .map(entry => [JSON.stringify(entry.address), entry.address])).values()];
      output[role] = { address: found.length === 1 ? found[0] : null, evidence: evidence[role] };
    }

    const decimal = value => value?.replace(/,/g, "") ?? null;
    const numberPattern = String.raw`(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?`;
    const money = String.raw`(?:\d{1,3}(?:,\d{3})+|\d+)\.\d{2,4}`;
    const units = "(?:EACH|EA|PCS?|UNIT|SET|YR|MO)";
    const tail = new RegExp(
      "\\s+(?<qty>" + numberPattern + ")\\s*(?:" + units + ")?\\s+\\$?(?<price>" + money +
      ")\\s*(?:" + units + ")?\\s+(?:(?<discount>" + numberPattern + ")%\\s+)?\\$?(?<amount>" + money + ")\\s*$", "i");
    const xeroxTail = new RegExp("\\s+" + units + "\\s+(?<qty>" + numberPattern +
      ")\\s+(?:[A-Z][A-Z0-9-]+\\s+)?\\$?(?<price>" + money + ")\\s+\\$?(?<amount>" + money + ")\\s*$", "i");
    const totalPattern = new RegExp("\\b(?<label>total\\s+purchase\\s+order|grand\\s+total|total\\s+amount|" +
      "po\\s+total(?:\\s*/\\s*totale?\\s+du)?|sub\\s*total|freight|shipping\\s+charge|sales\\s+tax|tax(?:\\s*/\\s*taxe)?|total)" +
      "\\s*:?\\s*(?<currency>USD|CAD)?\\s*\\$?\\s*(?<value>" + money + ")\\s*$", "i");
    const currencyAmount = new RegExp("\\b(?<currency>USD|CAD)\\s+\\$?(?<value>" + money + ")\\s*$", "i");
    const poNumber = /\b(?:purchase\s+order\s*(?:no\.?|number|#)?|order\s+number)\s*:?\s+(?<value>[A-Z0-9][A-Z0-9/-]*\d[A-Z0-9/-]*)\b/i;
    const skuPattern = /^[A-Z0-9][A-Z0-9._/-]*$/i;
    const amounts = {}, items = [], poNumbers = new Set();
    let layout, previous, pendingTotal = false;
    function addAmount(label, value, currency) {
      const key = label.toLowerCase().replace(/\s/g, "");
      const name = key.startsWith("pototal") ? "total" : key.startsWith("tax/") ? "tax"
        : ({ totalpurchaseorder: "total", grandtotal: "total", totalamount: "total", salestax: "tax", shippingcharge: "freight" })[key] || key;
      if (!amounts[name]) amounts[name] = { value: decimal(value), currency: currency?.toUpperCase() };
      else if (amounts[name].value !== decimal(value)) amounts[name].ambiguous = true;
    }

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) continue;
      const po = line.match(poNumber)?.groups;
      if (po) poNumbers.add(po.value);
      const printedTotal = line.match(totalPattern)?.groups;
      const separateTotal = pendingTotal && line.match(currencyAmount)?.groups;
      pendingTotal = /\bTOTAL AMOUNT\s*$/i.test(line);
      if (printedTotal) addAmount(printedTotal.label, printedTotal.value, printedTotal.currency);
      if (separateTotal) addAmount("total", separateTotal.value, separateTotal.currency);
      const upper = line.toUpperCase();
      if (upper.includes("LINE ITEM DETAILS") || /SUPPLIER.*BUYER PART.*QTY/.test(upper)) { layout = "konica"; previous = null; continue; }
      if (/SUPPLIER PART/.test(upper) && /ITEM NBR|QTY/.test(upper) && /PRICE|PRIX/.test(upper)) { layout = "bilingual"; previous = null; continue; }
      if (/ITEM DESCRIPTION/.test(upper) && /EXTENSION/.test(upper) && /QUANTITY/.test(upper)) { layout = "xerox"; previous = null; continue; }
      if (/\bITEM\b/.test(upper) && /\b(?:QTY|QUANTITY)\b/.test(upper) && /PRICE/.test(upper)) { layout = "standard"; previous = null; continue; }
      if (printedTotal || /^(TERMS AND CONDITIONS|SIGNATURE)/.test(upper)) { layout = null; previous = null; continue; }
      if (!layout) continue;
      const row = line.match(/^(?<line>\d{1,6})\s+(?<body>.+)$/)?.groups;
      if (!row) {
        if (layout === "xerox" && previous && skuPattern.test(line)) {
          const half = line.slice(0, line.length / 2);
          if (half.includes("-") && half + half === line) {
            if (previous.sku && previous.sku !== half) previous.sku_conflict = true;
            else previous.sku = half;
          }
        }
        continue;
      }
      const values = row.body.match(layout === "xerox" ? xeroxTail : tail);
      const prefix = (values ? row.body.slice(0, values.index) : row.body).trim();
      const cells = prefix.split(/ {2,}/);
      let sku = cells[0]?.split(/\s+/)[0], buyer = null;
      if (layout === "konica") {
        buyer = cells.length >= 3 ? cells.at(-1) : null;
        sku = cells.length >= 3 ? cells.at(-2) : null;
      } else if (layout === "bilingual") {
        buyer = sku;
        const rest = cells.slice(1).filter(value => !/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(value));
        sku = rest.at(-1) || null;
      } else if (layout === "xerox") {
        buyer = sku;
        sku = null;
      }
      if (!sku || !skuPattern.test(sku)) sku = null;
      if (!values && !sku && !buyer) continue;
      const nums = values?.groups || {};
      previous = {
        line: row.line, page: null, sku, buyer_code: buyer, catalog_candidates: [],
        quantity: decimal(nums.qty), unit_price: decimal(nums.price), amount: decimal(nums.amount),
        discount_percent: decimal(nums.discount), source: line
      };
      items.push(previous);
    }

    for (const item of items) {
      if (item.sku_conflict) item.sku = null;
      if (!item.sku || item.amount === null) warnings.push("Line " + item.line + ": verify the SKU and amount against the original PO.");
      item.arithmetic_ok = false;
      if (item.quantity !== null && item.unit_price !== null && item.amount !== null) {
        const expected = Number(item.quantity) * Number(item.unit_price) *
          (1 - Number(item.discount_percent ?? 0) / 100);
        item.arithmetic_ok = Math.abs(expected - Number(item.amount)) <= 0.011;
        if (!item.arithmetic_ok) warnings.push("Line " + item.line + ": quantity, unit price, and printed amount do not reconcile. Check for OCR or adjustments.");
      }
    }
    if (!items.length) warnings.push("No item rows could be read confidently. Check the original PO.");
    if (lines.filter(line => line.trim()).length < 3) warnings.push("Zoho returned little or no line structure. Check the original PO.");
    return { ...output, items, amounts, po_numbers: [...poNumbers], warnings };
  }

  async function scanWithModel(salesOrderId, attachmentId, ocrMode) {
      const response = await window.ZOHO.CRM.FUNCTIONS.execute("scan_sales_order_po", {
        arguments: JSON.stringify({ salesOrderId, attachmentId, ocrMode })
      });
      const output = response?.details?.output ?? response?.data?.details?.output ?? response?.output;
      if (output == null) {
        const rawCode = String(response?.code ?? "NO_OUTPUT");
        const code = /^[A-Za-z][A-Za-z0-9_]{0,79}$/.test(rawCode) ? rawCode : "NO_OUTPUT";
        throw new Error("The Zoho function returned no result (" + code + "). Check the function API name and access.");
      }
      let data;
      try {
        data = typeof output === "string" ? JSON.parse(output) : output;
      } catch {
        throw new Error("The Zoho function returned an unreadable result.");
      }
      if (!data?.ok || typeof data.text !== "string") {
        throw new Error(data?.error || "Zoho OCR did not return document text.");
      }
      if (String(data.salesOrderId) !== salesOrderId || String(data.attachmentId) !== attachmentId ||
          data.model !== ocrMode) {
        throw new Error("The function response could not be verified against this attachment. Update the standalone function before scanning.");
      }
      return parseOcr(data.text);
  }

  function extractionScore(scan) {
    return (scan.billing.address ? 1 : 0) + (scan.shipping.address ? 1 : 0)
      + scan.items.filter(item => item.sku && item.arithmetic_ok).length * 2;
  }

  async function runScan() {
    if (!selectedAttachment) return;
    const request = ++scanRequest;
    const { salesOrderId, attachmentId } = selectedAttachment;
    result = undefined;
    results.replaceChildren();
    scanStatus.textContent = "Zoho is reading the selected PO…";
    try {
      let extracted = await scanWithModel(salesOrderId, attachmentId, "OCR");
      if (request !== scanRequest) return;
      if (!extracted.items.some(item => item.sku && item.arithmetic_ok)) {
        scanStatus.textContent = "Checking the layout with Zoho Document OCR…";
        try {
          const alternate = await scanWithModel(salesOrderId, attachmentId, "DOCUMENT");
          if (request !== scanRequest) return;
          if (extractionScore(alternate) > extractionScore(extracted)) extracted = alternate;
        } catch {
          if (request !== scanRequest) return;
          extracted.warnings.push("The alternate Zoho OCR mode could not complete. Verify the original PO.");
        }
      }
      result = extracted;
      scanStatus.textContent = "Scan complete. Review differences and any unconfirmed fields.";
      renderResults();
    } catch (error) {
      if (request !== scanRequest) return;
      scanStatus.textContent = error instanceof Error
        ? "Scan failed. " + error.message
        : "Zoho could not run the scan function. Check the function and its connection.";
    }
  }

  function errorCode(error) {
    const status = Number(error?.status || error?.response?.status || 0);
    const candidate = error?.details?.code || error?.details?.data?.code
      || error?.response?.data?.code || error?.name || "UNKNOWN";
    const code = /^[A-Za-z][A-Za-z0-9_]{0,79}$/.test(String(candidate)) ? candidate : "UNKNOWN";
    return [status || "no HTTP status", code].join(", ");
  }

  async function attachment(orderPath, file) {
    const request = ++fileRequest;
    clearFile();
    if (!file) return;
    selectedAttachment = { salesOrderId: orderPath.split("/").pop(), attachmentId: String(file.id) };
    void runScan();
    attachmentStatus.textContent = "Loading the CRM attachment preview…";
    try {
      const response = await zrc.get(orderPath + "/Attachments/" + file.id, { responseType: "blob" });
      if (request !== fileRequest) return;
      if (response.status !== 200 || !(response.data instanceof Blob)) {
        throw Object.assign(new Error("File download failed."), { status: response.status });
      }
      await selectFile(response.data, file.File_Name, request);
      if (request === fileRequest) attachmentStatus.textContent = file.File_Name;
    } catch (error) {
      if (request === fileRequest) {
        attachmentStatus.textContent = "CRM attachment preview unavailable (" + errorCode(error) + "). The OCR status is shown on the right.";
      }
    }
  }

  async function listAttachments(orderPath) {
    try {
      const response = await zrc.get(orderPath + "/Attachments", {
        params: { fields: "id,File_Name", per_page: 200 }
      });
      if (![200, 204].includes(response.status)) throw Object.assign(new Error(), {
        status: response.status, details: response.data
      });
      return response.data || {};
    } catch (firstError) {
      // Try the SDK's related-list route using the same signed-in CRM user.
      if (!window.ZOHO?.CRM?.API?.getRelatedRecords) throw firstError;
      let related;
      try {
        related = await window.ZOHO.CRM.API.getRelatedRecords({
          Entity: "Sales_Orders",
          RecordID: orderPath.split("/").pop(),
          RelatedList: "Attachments",
          page: 1,
          per_page: 200
        });
      } catch {
        throw firstError;
      }
      if (!Array.isArray(related?.data)) throw firstError;
      return related;
    }
  }

  async function loadAttachments(orderPath, request) {
    try {
      const attachments = await listAttachments(orderPath);
      if (request !== recordRequest) return;
      const files = (attachments.data || []).filter(file =>
        /^\d+$/.test(String(file.id)) && /\.(pdf|png|jpe?g)$/i.test(file.File_Name || ""));
      if (!files.length) {
        attachmentStatus.textContent = "No supported files found on the first page of CRM attachments.";
        scanStatus.textContent = "Add a PDF, PNG, or JPEG attachment to the Sales Order to scan it.";
        return;
      }
      picker.replaceChildren(new Option("Choose the PO…", ""));
      for (const file of files) picker.add(new Option(file.File_Name, String(file.id)));
      picker.hidden = false;
      picker.onchange = () => void attachment(orderPath, files.find(file => String(file.id) === picker.value));
      attachmentStatus.textContent = attachments.info?.more_records
        ? "Choose the PO from the first page of attachments." : "Choose the purchase order.";
      scanStatus.textContent = "The scan starts automatically once a PO is selected.";
      const poReference = key(order?.Purchase_Order);
      const referenceMatches = /^[A-Z0-9][A-Z0-9._-]*$/.test(poReference)
        ? files.filter(file => key(file.File_Name.replace(/\.[^.]+$/, "")) === poReference)
        : [];
      const selected = files.length === 1 ? files[0]
        : referenceMatches.length === 1 ? referenceMatches[0] : undefined;
      if (selected && !attachments.info?.more_records && !selectedAttachment) {
        picker.value = String(selected.id);
        await attachment(orderPath, selected);
      }
    } catch (error) {
      if (request !== recordRequest) return;
      attachmentStatus.textContent = "Attachment list failed (" + errorCode(error) + "). Check the Sales Order attachment access.";
      scanStatus.textContent = "Zoho OCR is waiting for an attachment.";
    }
  }

  async function loadOrder(context) {
    const request = ++recordRequest;
    ++fileRequest;
    clearFile();
    order = undefined;
    el("order-details").replaceChildren();
    picker.replaceChildren();
    picker.hidden = true;
    picker.onchange = null;
    const native = context?.Entity === "Sales_Orders" ? context.EntityId : undefined;
    const id = context?.salesOrderId ?? context?.data?.salesOrderId ?? (Array.isArray(native) ? native[0] : native);
    if (!/^\d+$/.test(String(id))) {
      orderStatus.textContent = "No Sales Order ID received. Open Review PO from a Sales Order.";
      return;
    }
    if (typeof zrc === "undefined" || typeof zrc.get !== "function") {
      orderStatus.textContent = "The Zoho Request Client did not load.";
      return;
    }
    const path = "/crm/v8/Sales_Orders/" + id;
    orderStatus.textContent = "Loading the Sales Order…";
    attachmentStatus.textContent = "Waiting for the Sales Order…";
    try {
      const response = await zrc.get(path);
      if (request !== recordRequest) return;
      order = response.data?.data?.[0];
      if (!order || String(order.id) !== String(id)) {
        order = undefined;
        throw Object.assign(new Error(), { status: response.status, details: response.data });
      }
      orderStatus.textContent = order.Subject || "Current Sales Order";
      displayOrder();
      void loadAttachments(path, request);
    } catch (error) {
      if (request === recordRequest) orderStatus.textContent = "Sales Order read failed (" + errorCode(error) + ").";
    }
  }

  if (window.self === window.top) {
    orderStatus.textContent = "Standalone test · open Review PO in Zoho for the Sales Order comparison.";
    attachmentStatus.textContent = "This page loads its attachment inside Zoho CRM."
    return;
  }
  const timer = setTimeout(() => {
    orderStatus.textContent = "Timed out waiting for Zoho record context.";
    attachmentStatus.textContent = "Open this widget from the Sales Order detail page."
  }, 12000);
  const sdk = document.createElement("script");
  sdk.src = "https://live.zwidgets.com/js-sdk/1.5/ZohoEmbededAppSDK.min.js";
  sdk.onerror = () => {
    clearTimeout(timer);
    orderStatus.textContent = "Zoho SDK could not load.";
  };
  sdk.onload = async () => {
    try {
      ZOHO.embeddedApp.on("PageLoad", context => {
        clearTimeout(timer);
        void loadOrder(context);
      });
      await ZOHO.embeddedApp.init();
    } catch {
      clearTimeout(timer);
      orderStatus.textContent = "Zoho SDK could not initialize.";
    }
  };
  document.head.append(sdk);
})();
</script>
</body>
</html>
