<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Official Zoho Embedded App SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.3/ZohoEmbededAppSDK.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        #debugBar {
            background-color: #f4f6f9;
            border-bottom: 1px solid #dcdcdc;
            padding: 8px 12px;
            font-size: 12px;
            color: #333;
            word-break: break-all;
        }
        #debugBar a {
            color: #0275d8;
            font-weight: bold;
            margin-left: 10px;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 35px);
            border: none;
        }
    </style>
</head>
<body>
    <div id="debugBar">Initializing Zoho CRM Session...</div>
    <iframe id="analyticsDashboard" src="about:blank"></iframe>

    <script>
        ZOHO.embeddedApp.on("PageLoad", function(data) {
            ZOHO.CRM.CONFIG.getCurrentUser().then(function(response) {
                var debugBar = document.getElementById("debugBar");

                if (!response || !response.users || response.users.length === 0) {
                    debugBar.innerHTML = "<strong style='color:red;'>Error:</strong> Could not retrieve CRM user profile.";
                    return;
                }

                var user = response.users[0];
                
                // Safely format First + Last Name without 'null' or 'undefined'
                var firstName = (user.first_name && user.first_name !== "null") ? user.first_name.trim() : "";
                var lastName = (user.last_name && user.last_name !== "null") ? user.last_name.trim() : "";
                var ownerName = (firstName + " " + lastName).trim();

                if (!ownerName && user.full_name) {
                    ownerName = user.full_name.trim();
                }

                // Base Embed Link
                var baseUrl = "https://analytics.zoho.com/open-view/1095920000073048250/3691e1aceebe36fe8f0e44429d1921e24d3f378971f3ee8ecd20653043885176";[cite: 9]

                // SQL Table and Column Names
                var queryTableName = "Accounts with Parent Account Name Query";[cite: 7]
                var ownerColumnName = "a.Account Owner Name";[cite: 7, 9]

                // Construct Criteria
                var rawCriteria = '("' + queryTableName + '"."' + ownerColumnName + '"=\'' + ownerName + '\')';
                var fullUrl = baseUrl + '?ZOHO_CRITERIA=' + encodeURIComponent(rawCriteria);

                // Print status banner above iframe
                debugBar.innerHTML = "<strong>User Detected:</strong> " + ownerName + 
                                     " | <a href='" + fullUrl + "' target='_blank'>Open Generated Link in New Tab</a>";

                // Load iframe
                document.getElementById("analyticsDashboard").src = fullUrl;
            });
        });

        ZOHO.embeddedApp.init();
    </script>
</body>
</html>
